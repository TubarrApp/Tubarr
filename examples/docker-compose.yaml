services:
  tubarr:
    image: ghcr.io/tubarrapp/tubarr:latest
    container_name: tubarr
    restart: unless-stopped
    ports:
      - "8827:8827"
    devices:
      # GPU device for hardware acceleration
      - /dev/dri:/dev/dri
    volumes:
      # Folder where videos are saved (container UID/GID must have write access)
      - /home/user/videos:/videos:rw,z
      # Where Tubarr and Metarr save their data (must be owned by PUID/PGID specified below)
      - /opt/containers/tubarr/.tubarr:/home/tubarr/.tubarr:Z
      - /opt/containers/tubarr/.metarr:/home/tubarr/.metarr:Z
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - UMASK=022
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8827/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      # Opt in to automatic image updates via Watchtower (optional)
      - com.centurylinklabs.watchtower.enable=true
