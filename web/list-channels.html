<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
    </style>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>List Channels | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    x-data="{ page: 'listChannels', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    class="dark bg-gray-900"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Channels" -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- include:header title="List Channels" -->

        <!-- ===== Main Content Start ===== -->
        <main class="h-full">
          <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">

            <!-- Channels List Start -->
            <div x-data="channelsList()" x-init="loadChannels()">
              <!-- Loading State -->
              <div x-show="loading" class="flex justify-center items-center py-12">
                <div class="h-12 w-12 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
              </div>

              <!-- Error State -->
              <div x-show="error" class="mb-4 rounded-lg bg-red-50 p-4 dark:bg-red-900/20">
                <p class="text-sm text-red-800 dark:text-red-400" x-text="error"></p>
              </div>

              <!-- Empty State -->
              <div x-show="!loading && channels.length === 0 && !error" class="text-center py-12">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">No channels</h3>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Get started by creating a new channel.</p>
                <div class="mt-6">
                  <a href="add-channel.html" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500">
                    Add Channel
                  </a>
                </div>
              </div>

              <!-- Channels List -->
              <div x-show="!loading && channels.length > 0" class="space-y-4">
                <!-- Expand/Collapse All Button -->
                <div class="flex justify-end mb-2">
                  <button
                    @click="toggleAll()"
                    class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-700 dark:hover:bg-gray-700"
                  >
                    <span x-text="expandedChannels.length === channels.length ? 'Collapse All' : 'Expand All'"></span>
                  </button>
                </div>

                <template x-for="channel in channels" :key="channel.id">
                  <div class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
                    <!-- Channel Header (clickable) -->
                    <div
                      @click="toggleChannel(channel.id)"
                      class="flex items-center justify-between p-4 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                    >
                      <div class="flex-1">
                        <div class="flex items-center gap-2">
                          <svg
                            x-show="channel.settings?.paused"
                            class="w-4 h-4 text-gray-500 dark:text-gray-400"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            title="Channel is paused"
                          >
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                          </svg>
                          <h3 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="channel.name"></h3>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">
                          <span x-text="channel.url_models?.filter(u => u.url !== 'manual-downloads').length || 0"></span> URL<span x-show="channel.url_models?.filter(u => u.url !== 'manual-downloads').length !== 1">s</span>
                          <template x-if="availableCounts[channel.id]">
                            <a
                              :href="`available.html?channel=${channel.id}`"
                              @click.stop
                              class="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-brand-50 text-brand-500 hover:text-brand-600 dark:bg-brand-500/15 dark:text-brand-400"
                              x-text="`${availableCounts[channel.id]} available`"
                            ></a>
                          </template>
                        </p>
                        <p x-show="channel.load_error" class="mt-1 text-sm text-error-600 dark:text-error-500" x-text="channel.load_error"></p>
                      </div>
                      <svg
                        class="w-5 h-5 text-gray-400 transition-transform"
                        :class="expandedChannels.includes(channel.id) ? 'rotate-180' : ''"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                      </svg>
                    </div>

                    <!-- Channel Details (expandable) -->
                    <div
                      x-show="expandedChannels.includes(channel.id)"
                      x-transition:enter="transition ease-out duration-200"
                      x-transition:enter-start="opacity-0 transform scale-95"
                      x-transition:enter-end="opacity-100 transform scale-100"
                      x-transition:leave="transition ease-in duration-150"
                      x-transition:leave-start="opacity-100 transform scale-100"
                      x-transition:leave-end="opacity-0 transform scale-95"
                      class="border-t border-gray-200 dark:border-gray-800"
                    >
                      <div class="p-4 space-y-6">
                        <!-- Basic Info Section -->
                        <div>
                          <h4 class="text-sm font-semibold text-brand-600 dark:text-brand-400 mb-3 uppercase tracking-wide">Basic Info</h4>
                          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">ID:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.id"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Last Scan:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="formatDate(channel.last_scan)"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">URLs:</span>
                              <ul class="ml-2 mt-1 space-y-1">
                                <template x-for="urlModel in channel.url_models" :key="urlModel.id">
                                  <li x-show="urlModel.url !== 'manual-downloads'" class="text-gray-900 dark:text-white break-all flex items-center gap-2">
                                    <svg
                                      x-show="urlModel.settings?.paused"
                                      class="w-4 h-4 text-gray-500 dark:text-gray-400 flex-shrink-0"
                                      fill="none"
                                      stroke="currentColor"
                                      viewBox="0 0 24 24"
                                      title="URL is paused"
                                    >
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <span x-text="urlModel.url"></span>
                                    <template x-if="urlModel.username">
                                      <span class="ml-2 text-xs text-green-600 dark:text-green-400">(authenticated)</span>
                                    </template>
                                  </li>
                                </template>
                              </ul>
                            </div>
                          </div>
                        </div>

                        <!-- Basic Settings Section -->
                        <div x-show="channel.settings">
                          <h4 class="text-sm font-semibold text-brand-600 dark:text-brand-400 mb-3 uppercase tracking-wide">Basic Settings</h4>
                          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Profile:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.profile || 'None'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Video Directory:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.settings?.video_directory || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">JSON Directory:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.settings?.json_directory || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Crawl Frequency:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="(channel.settings?.crawl_freq || 30) + ' minutes'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Max Concurrency:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.download_concurrency || 1"></span>
                              <span x-show="capNote(channel.settings?.download_concurrency, globalDownloadLimit)" class="ml-2 text-xs text-warning-600 dark:text-warning-500" x-text="capNote(channel.settings?.download_concurrency, globalDownloadLimit)"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Download Retries:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.download_retries || 2"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Use Global Cookies:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.use_global_cookies ? 'Yes' : 'No'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Channel Config File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.channel_config_file || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">From Date:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.from_date || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">To Date:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.to_date || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filters:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.filters ? channel.settings.filters.split('\n').filter(l => l.trim()).length + ' filter(s)' : 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filter File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.settings?.filter_file || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Paused:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.paused ? 'Yes' : 'No'"></span>
                            </div>
                          </div>
                        </div>

                        <!-- Yt-dlp Settings Section -->
                        <div x-show="channel.settings">
                          <h4 class="text-sm font-semibold text-brand-600 dark:text-brand-400 mb-3 uppercase tracking-wide">Yt-dlp Settings</h4>
                          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">YT-DLP Output Extension:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.ytdlp_output_ext || 'Default'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Cookies From Browser:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.settings?.cookies_from_browser || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Max Filesize:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.max_filesize || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">External Downloader:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.external_downloader || 'Default (yt-dlp built-in)'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">External Downloader Args:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.external_downloader_args || 'Not set'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">Extra YT-DLP Video Args:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.extra_ytdlp_video_args || 'Not set'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">Extra YT-DLP Meta Args:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.extra_ytdlp_meta_args || 'Not set'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">Extra YT-DLP Crawl Args:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.settings?.extra_ytdlp_crawl_args || 'Not set'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">YT-DLP Preferred Video Codecs:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="formatPreferredCodecs(channel.settings?.ytdlp_preferred_video_codecs)"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">YT-DLP Preferred Audio Codecs:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="formatPreferredCodecs(channel.settings?.ytdlp_preferred_audio_codecs)"></span>
                            </div>
                          </div>
                        </div>

                        <!-- Metarr Settings Section -->
                        <div x-show="channel.metarr || channel.settings?.move_ops || channel.settings?.move_ops_file">
                          <h4 class="text-sm font-semibold text-brand-600 dark:text-brand-400 mb-3 uppercase tracking-wide">Post-processing</h4>
                          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">Output Directory:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.metarr?.metarr_output_directory || 'Not configured'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Move Ops File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white break-all" x-text="channel.settings?.move_ops_file || 'Not set'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">Move Operations:</span>
                              <span :class="channel.settings?.move_ops ? 'block mt-1 break-words' : 'ml-2'" class="text-gray-900 dark:text-white font-mono text-xs" style="white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;" x-text="channel.settings?.move_ops ? formatFilteredOps(channel.settings.move_ops) : 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Output Extension:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_output_ext || 'Same as input'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Rename Style:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_rename_style || 'Skip'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Concurrency:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_concurrency || 'Global'"></span>
                              <span x-show="capNote(channel.metarr?.metarr_concurrency, globalPostProcessLimit)" class="ml-2 text-xs text-warning-600 dark:text-warning-500" x-text="capNote(channel.metarr?.metarr_concurrency, globalPostProcessLimit)"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Max CPU Usage:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_max_cpu_usage ? channel.metarr.metarr_max_cpu_usage + '%' : 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Min Free Memory:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_min_free_mem || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">GPU Acceleration:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_gpu || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">GPU Node Path:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_transcode_gpu_node || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Video Codecs:</span>
                              <span class="ml-2 text-gray-900 dark:text-white font-mono text-sm" x-text="Array.isArray(channel.metarr?.metarr_transcode_video_transcode_codecs) && channel.metarr.metarr_transcode_video_transcode_codecs.length > 0 ? channel.metarr.metarr_transcode_video_transcode_codecs.join(', ') : (channel.metarr?.metarr_transcode_video_transcode_codecs || 'Copy')"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Audio Codecs:</span>
                              <span class="ml-2 text-gray-900 dark:text-white font-mono text-sm" x-text="Array.isArray(channel.metarr?.metarr_transcode_audio_codecs) && channel.metarr.metarr_transcode_audio_codecs.length > 0 ? channel.metarr.metarr_transcode_audio_codecs.join(', ') : (channel.metarr?.metarr_transcode_audio_codecs || 'Copy')"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Transcode Quality (CRF):</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_transcode_quality || 'Not set'"></span>
                            </div>
                            <div class="md:col-span-2">
                              <span class="text-gray-500 dark:text-gray-400">Extra FFmpeg Args:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_extra_ffmpeg_args || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Meta Operations:</span>
                              <span class="ml-2 text-gray-900 dark:text-white font-mono text-xs" style="white-space: pre-line;" x-text="channel.metarr?.metarr_meta_ops || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filename Operations:</span>
                              <span class="ml-2 text-gray-900 dark:text-white font-mono text-xs" style="white-space: pre-line;" x-text="channel.metarr?.metarr_filename_ops || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Meta Ops File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_meta_ops_file || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filename Ops File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_filename_ops_file || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filtered Meta Ops File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_filtered_meta_ops_file || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filtered Meta Operations:</span>
                              <span :class="channel.metarr?.metarr_filtered_meta_ops ? 'block mt-1 break-words' : 'ml-2'" class="text-gray-900 dark:text-white font-mono text-xs" style="white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;" x-text="channel.metarr?.metarr_filtered_meta_ops ? formatFilteredOps(channel.metarr.metarr_filtered_meta_ops) : 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filtered Filename Ops File:</span>
                              <span class="ml-2 text-gray-900 dark:text-white" x-text="channel.metarr?.metarr_filtered_filename_ops_file || 'Not set'"></span>
                            </div>
                            <div>
                              <span class="text-gray-500 dark:text-gray-400">Filtered Filename Operations:</span>
                              <span :class="channel.metarr?.metarr_filtered_filename_ops ? 'block mt-1 break-words' : 'ml-2'" class="text-gray-900 dark:text-white font-mono text-xs" style="white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;" x-text="channel.metarr?.metarr_filtered_filename_ops ? formatFilteredOps(channel.metarr.metarr_filtered_filename_ops) : 'Not set'"></span>
                            </div>
                          </div>
                        </div>

                        <!-- Authentication Section -->
                        <div x-show="hasAuth(channel)">
                          <h4 class="text-sm font-semibold text-brand-600 dark:text-brand-400 mb-3 uppercase tracking-wide">Authentication</h4>
                          <div class="space-y-2 text-sm">
                            <template x-for="urlModel in channel.url_models" :key="urlModel.id">
                              <div x-show="urlModel.url !== 'manual-downloads' && urlModel.username" class="p-3 bg-gray-50 dark:bg-gray-800 rounded-lg">
                                <div class="font-medium text-gray-900 dark:text-white break-all" x-text="urlModel.url"></div>
                                <div class="mt-1 text-gray-600 dark:text-gray-400">
                                  <span>Username: </span><span x-text="urlModel.username"></span>
                                </div>
                                <div class="mt-1 text-gray-600 dark:text-gray-400">
                                  <span>Password: ********</span>
                                </div>
                                <div class="mt-1 text-gray-600 dark:text-gray-400 break-all">
                                  <span>Login URL: </span><span x-text="urlModel.login_url"></span>
                                </div>
                              </div>
                            </template>
                          </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-2 pt-2">
                          <button
                            @click.stop="editChannel(channel.id)"
                            class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500"
                          >
                            Edit
                          </button>
                          <button
                            @click.stop="deleteChannel(channel.id, channel.name)"
                            class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                          >
                            Delete
                          </button>

                      </div>
                    </div>
                  </div>

              </div>
            </div>

          </div>

      </div>

    <script defer src="bundle.js"></script>
    <script>
      function channelsList() {
        return {
          channels: [],
          expandedChannels: [],
          availableCounts: {}, // Channel ID -> videos waiting to be chosen.
          loading: false,
          error: '',
          globalDownloadLimit: 0,
          globalPostProcessLimit: 0,

          // A note when a limit is above the global one (0 = unlimited), which caps it.
          capNote(value, global) {
            return global > 0 && value > global ? `(capped at ${global} by global limit)` : '';
          },

          async loadGlobalLimits() {
            try {
              const [postProcess, download] = await Promise.all([
                fetch('/api/v1/settings/post-process-concurrency'),
                fetch('/api/v1/settings/global-download-concurrency')
              ]);
              if (postProcess.ok) this.globalPostProcessLimit = (await postProcess.json()).limit ?? 0;
              if (download.ok) this.globalDownloadLimit = (await download.json()).limit ?? 0;
            } catch (err) {
              console.error('Error loading global concurrency limits:', err);
            }
          },

          async loadAvailableCounts() {
            try {
              const response = await fetch('/api/v1/videos/available');
              if (!response.ok) return;
              const counts = {};
              for (const v of await response.json() || []) {
                counts[v.channel_id] = (counts[v.channel_id] || 0) + 1;
              }
              this.availableCounts = counts;
            } catch (err) {
              console.error('Error loading available videos:', err);
            }
          },

          async loadChannels() {
            this.loading = true;
            this.error = '';
            this.loadAvailableCounts();
            this.loadGlobalLimits();

            try {
              const response = await fetch('/api/v1/channels/all');

              if (!response.ok) {
                throw new Error(`Failed to load channels: ${response.statusText}`);
              }

              const data = await response.json();

              // Sort channels alphabetically by name
              this.channels = data.sort((a, b) =>
                (a.name || '').localeCompare(b.name || '')
              );

              // Debug: Log first channel to verify data structure
              if (this.channels.length > 0) {
                console.log('First channel data:', this.channels[0]);
                console.log('URL models:', this.channels[0].url_models);
              }
            } catch (err) {
              this.error = err.message || 'Failed to load channels';
              console.error('Error loading channels:', err);
            } finally {
              this.loading = false;
            }
          },

          toggleChannel(channelId) {
            const index = this.expandedChannels.indexOf(channelId);
            if (index > -1) {
              this.expandedChannels.splice(index, 1);
            } else {
              this.expandedChannels.push(channelId);
            }
          },

          toggleAll() {
            if (this.expandedChannels.length === this.channels.length) {
              // All expanded, so collapse all
              this.expandedChannels = [];
            } else {
              // Some or none expanded, so expand all
              this.expandedChannels = this.channels.map(c => c.id);
            }
          },

          hasAuth(channel) {
            return channel.url_models?.some(url => url.username);
          },

          formatDate(dateString) {
            if (!dateString || dateString === '0001-01-01T00:00:00Z') {
              return 'Never';
            }
            try {
              const date = new Date(dateString);
              return date.toLocaleString();
            } catch (e) {
              return 'Invalid date';
            }
          },

          // Shows each filtered op with its filters and op on separate rows, and a blank line between ops.
          formatFilteredOps(text) {
            return text.split('\n').filter(line => line.trim()).map(line => {
              let rows = '    ';
              let escaped = false;
              for (let i = 0; i < line.length; i++) {
                // A backslash escapes the next character, so an escaped "&&" or "||" stays in its value.
                if (escaped) {
                  escaped = false;
                } else if (line[i] === '\\') {
                  escaped = true;
                } else if (line.startsWith('||', i)) {
                  return rows + '\n||  ' + line.slice(i + 2);
                } else if (line.startsWith('&&', i)) {
                  rows += '\n&&  ';
                  i++;
                  continue;
                }
                rows += line[i];
              }
              return rows;
            }).join('\n\n');
          },

          formatPreferredCodecs(codecs) {
            if (Array.isArray(codecs)) {
              return codecs.length ? codecs.join(', ') : 'Not set';
            }
            if (typeof codecs === 'string') {
              return codecs.trim() || 'Not set';
            }
            return 'Not set';
          },

          editChannel(channelId) {
            // TODO: Implement edit functionality
            window.location.href = `edit-channel.html?id=${channelId}`;
          },

          async deleteChannel(channelId, channelName) {
            if (!confirm(`Are you sure you want to delete the channel "${channelName}"? This action cannot be undone.`)) {
              return;
            }

            try {
              const response = await fetch(`/api/v1/channels/${channelId}/delete`, {
                method: 'DELETE'
              });

              if (!response.ok) {
                throw new Error(`Failed to delete channel: ${response.statusText}`);
              }

              // Reload channels after successful deletion
              await this.loadChannels();
            } catch (err) {
              this.error = err.message || 'Failed to delete channel';
              console.error('Error deleting channel:', err);
            }
          }
        };
      }
    </script>
  </body>
