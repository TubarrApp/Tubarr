<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
      .available-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .available-title { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .available-error { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; cursor: pointer; }
      .available-error.expanded { display: block; }
      .available-overlay { position: absolute; padding: 0.125rem 0.375rem; border-radius: 0.25rem; background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 0.75rem; line-height: 1rem; }
    </style>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Available Videos | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    x-data="{ page: 'available', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    class="dark bg-gray-900"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Available" -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- include:header title="Available Videos" -->

        <!-- ===== Main Content Start ===== -->
        <main class="h-full">
          <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">
            <div class="mb-6">
              <p class="text-sm text-gray-500 dark:text-gray-400">
                New videos from channels and URLs which don't download automatically. Choose which to download.
              </p>
            </div>

            <div x-data="availableData()" x-init="init()" @download-as-done.window="delete selected[$event.detail.id]; refreshAfterAction()">
              <!-- Loading State -->
              <div x-show="loading" class="text-center py-12">
                <div class="inline-block h-12 w-12 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Loading videos...</p>
              </div>

              <!-- Error State -->
              <div x-show="error" class="rounded-2xl border border-red-200 bg-red-50 px-5 py-7 dark:border-red-800 dark:bg-red-900/20">
                <p class="text-red-600 dark:text-red-400" x-text="error"></p>
              </div>

              <!-- Empty State -->
              <div x-show="!loading && !error && videos.length === 0" class="rounded-lg border border-gray-200 bg-white px-6 py-12 text-center dark:border-gray-800 dark:bg-gray-900">
                <p class="text-gray-900 dark:text-white font-medium">Nothing waiting</p>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                  To choose videos before they download, turn off "Download new videos automatically" in a channel's (or channel URL's) settings.
                </p>
              </div>

              <div x-show="!loading && !error && videos.length > 0" class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
                <!-- Filters -->
                <div class="flex flex-wrap items-center gap-4 border-b border-gray-200 px-6 py-5 dark:border-gray-800">
                  <input
                    type="search"
                    x-model="titleFilter"
                    @input="filterChanged()"
                    placeholder="Filter by title"
                    class="w-56 max-w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  />

                  <select
                    x-model="channelFilter"
                    @change="urlFilter = ''; filterChanged()"
                    class="max-w-full rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All channels (${videos.length})`"></option>
                    <template x-for="ch in channelOptions" :key="ch.id">
                      <option :value="ch.id" :selected="channelFilter === ch.id" x-text="`${ch.name} (${ch.count})`"></option>
                    </template>
                  </select>

                  <select
                    x-show="channelFilter !== '' && urlOptions.length > 1"
                    x-model="urlFilter"
                    @change="filterChanged()"
                    class="max-w-full rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All URLs (${channelVideos.length})`"></option>
                    <template x-for="u in urlOptions" :key="u.id">
                      <option :value="u.id" :selected="urlFilter === u.id" x-text="`${shortURL(u.url)} (${u.count})`"></option>
                    </template>
                  </select>

                  <select
                    x-model="statusFilter"
                    @change="filterChanged()"
                    class="rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All statuses (${notIgnoredCount})`"></option>
                    <option value="Available" x-text="`Untried (${statusCount('Available')})`"></option>
                    <option value="Failed" x-text="`Failed (${statusCount('Failed')})`"></option>
                    <option value="Canceled" x-text="`Canceled (${statusCount('Canceled')})`"></option>
                    <option value="Ignored" x-text="`Ignored (${statusCount('Ignored')})`"></option>
                  </select>

                  <select
                    x-model="sortOrder"
                    @change="currentPage = 1"
                    class="rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="longest">Longest first</option>
                    <option value="shortest">Shortest first</option>
                  </select>
                </div>

                <!-- Selection Bar -->
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-200 bg-gray-50 px-6 py-4 dark:border-gray-800 dark:bg-gray-800">
                  <div class="flex flex-wrap items-center gap-4 text-sm">
                    <span class="font-medium text-gray-900 dark:text-white">
                      <span x-text="selectedCount"></span> of <span x-text="filteredVideos.length"></span> selected
                    </span>
                    <button @click="selectPage()" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Select page</button>
                    <button @click="selectAllFiltered()" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Select all</button>
                    <button x-show="selectedCount > 0" @click="selected = {}" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-gray-100">Clear</button>
                  </div>
                  <div class="flex gap-3">
                    <button
                      x-show="ignoredView"
                      @click="act('restore')"
                      :disabled="selectedCount === 0 || working"
                      title="Move the selected videos back to Available, to download them past the download filters."
                      class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      Restore<span x-show="selectedCount > 0" x-text="` (${selectedCount})`"></span>
                    </button>
                    <button
                      x-show="!ignoredView"
                      @click="act('dismiss')"
                      :disabled="selectedCount === 0 || working"
                      title="Hide the selected videos. Crawls won't show them again."
                      class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700"
                    >
                      Dismiss
                    </button>
                    <button
                      x-show="!ignoredView"
                      @click="act('download')"
                      :disabled="selectedCount === 0 || working"
                      class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      Download<span x-show="selectedCount > 0" x-text="` (${selectedCount})`"></span>
                    </button>
                  </div>
                </div>

                <!-- No Matches (e.g. only ignored videos, which the default view hides) -->
                <div x-show="filteredVideos.length === 0" class="px-6 text-center" style="padding-top: 3rem; padding-bottom: 3rem;">
                  <p class="text-gray-900 dark:text-white font-medium" x-text="!ignoredView && notIgnoredCount === 0 ? 'Nothing waiting' : 'No videos match these filters'"></p>
                  <button
                    x-show="!ignoredView && statusCount('Ignored') > 0"
                    type="button"
                    @click="statusFilter = 'Ignored'; filterChanged()"
                    class="mt-2 text-sm text-brand-500 hover:underline dark:text-brand-400"
                    x-text="`${statusCount('Ignored')} ignored video(s) can be restored from the Ignored filter.`"
                  ></button>
                </div>

                <!-- Video Grid -->
                <div x-ref="grid" x-show="filteredVideos.length > 0" class="available-grid p-6">
                  <template x-for="(video, i) in paginatedVideos" :key="video.id">
                    <div
                      @click="toggle(video, startIndex + i, $event)"
                      class="cursor-pointer overflow-hidden rounded-lg border bg-white transition-colors dark:bg-gray-900"
                      :class="selected[video.id] ? 'border-brand-500 ring-2 ring-brand-500' : 'border-gray-200 hover:bg-gray-100 dark:border-gray-800 dark:hover:bg-gray-800'"
                    >
                      <div class="relative aspect-video bg-gray-200 dark:bg-gray-800">
                        <div class="flex h-full w-full items-center justify-center">
                          <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                          </svg>
                        </div>
                        <img
                          x-show="videoThumb(video)"
                          :src="videoThumb(video)"
                          :alt="video.title"
                          loading="lazy"
                          referrerpolicy="no-referrer"
                          @error="$el.style.display = 'none'"
                          class="absolute inset-0 h-full w-full object-cover"
                        />
                        <input
                          type="checkbox"
                          :checked="!!selected[video.id]"
                          @click.stop="toggle(video, startIndex + i, $event)"
                          class="absolute h-5 w-5 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                          style="top: 0.5rem; left: 0.5rem;"
                        />
                        <span
                          x-show="video.download_status.status !== 'Available'"
                          class="available-overlay"
                          style="top: 0.5rem; right: 0.5rem;"
                          :style="{ background: video.download_status.status === 'Ignored' ? '#4b5563' : '#b91c1c' }"
                          :title="video.download_status.error || ''"
                          x-text="video.retries_on_crawl ? `${video.download_status.status}: retries on next crawl (${video.crawl_dl_retries_left} left)` : video.download_status.status"
                        ></span>
                        <span
                          x-show="video.duration > 0"
                          class="available-overlay"
                          style="bottom: 0.5rem; right: 0.5rem;"
                          x-text="formatDuration(video.duration)"
                        ></span>
                      </div>
                      <div class="p-3">
                        <a
                          :href="safeURL(video.url)"
                          target="_blank"
                          rel="noopener noreferrer"
                          @click.stop
                          :title="video.title"
                          class="available-title text-sm font-medium text-gray-900 hover:text-brand-500 dark:text-white dark:hover:text-brand-400"
                          x-text="video.title"
                        ></a>
                        <p class="mt-1 truncate text-xs text-gray-500 dark:text-gray-400" :title="video.channel_url">
                          <span x-text="video.channel_name"></span> · <span x-text="shortURL(video.channel_url)"></span>
                        </p>
                        <p class="text-xs text-gray-500 dark:text-gray-400" x-text="formatDate(video.upload_date, video.created_at)"></p>
                        <p
                          x-show="video.download_status.error"
                          @click.stop="expandedErrors[video.id] = !expandedErrors[video.id]"
                          class="available-error mt-1 text-xs text-error-600 dark:text-error-500"
                          :class="expandedErrors[video.id] && 'expanded'"
                          :title="expandedErrors[video.id] ? 'Click to show less' : 'Click to show the whole error'"
                          x-text="video.download_status.error"
                        ></p>
                        <button
                          x-show="!ignoredView"
                          type="button"
                          @click.stop="$dispatch('download-as', video)"
                          title="Download this video with its own filename and Metarr ops."
                          class="mt-2 text-xs text-brand-500 hover:underline dark:text-brand-400"
                        >
                          Download As…
                        </button>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- Pagination -->
                <div x-show="totalPages > 1" class="border-t border-gray-200 px-6 py-4 dark:border-gray-800">
                  <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="text-sm text-gray-600 dark:text-gray-400">
                      Showing <span x-text="startIndex + 1"></span> to <span x-text="Math.min(endIndex, filteredVideos.length)"></span> of <span x-text="filteredVideos.length"></span> videos
                    </div>
                    <div class="flex gap-2">
                      <button
                        @click="goToPage(currentPage - 1)"
                        :disabled="currentPage === 1"
                        class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700"
                      >
                        Previous
                      </button>
                      <template x-for="p in visiblePages" :key="p">
                        <button
                          @click="goToPage(p)"
                          class="px-3 py-2 text-sm font-medium rounded-lg border"
                          :class="p === currentPage ? 'bg-brand-500 border-brand-500 text-white' : 'text-gray-700 bg-white border-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700'"
                          x-text="p"
                        ></button>
                      </template>
                      <button
                        @click="goToPage(currentPage + 1)"
                        :disabled="currentPage === totalPages"
                        class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700"
                      >
                        Next
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <!-- include:download-as -->

    <script defer src="bundle.js"></script>
    <script>
      function availableData() {
        return {
          videos: [],
          selected: {}, // Video ID -> video.
          channelFilter: '',
          urlFilter: '',
          titleFilter: '',
          statusFilter: '',
          sortOrder: 'newest',
          loading: true,
          error: null,
          working: false,
          currentPage: 1,
          itemsPerPage: 24,
          lastClickedIndex: null,
          expandedErrors: {}, // Video ID -> whether its whole error shows.

          init() {
            const params = new URLSearchParams(window.location.search);
            this.channelFilter = params.get('channel') || '';
            this.urlFilter = params.get('url') || '';
            this.titleFilter = params.get('q') || '';
            this.statusFilter = params.get('status') || '';
            this.loadVideos();
            new ResizeObserver(() => this.fitPageToRows()).observe(this.$refs.grid);
          },

          // Sets the page size to about 24 videos in full rows, for however many columns fit.
          fitPageToRows() {
            const columns = getComputedStyle(this.$refs.grid).gridTemplateColumns.split(' ').filter(c => c && c !== 'none').length;
            if (columns === 0) return; // Hidden.
            const first = this.startIndex;
            this.itemsPerPage = columns * Math.max(1, Math.round(24 / columns));
            this.currentPage = Math.floor(first / this.itemsPerPage) + 1; // Keep the first visible video on the page.
          },

          async loadVideos() {
            try {
              const response = await fetch('/api/v1/videos/available?ignored=1');
              if (!response.ok) {
                throw new Error(await response.text() || 'Failed to fetch available videos');
              }
              this.videos = await response.json() || [];
              this.error = null;
            } catch (err) {
              this.error = err.message;
            } finally {
              this.loading = false;
            }
          },

          // Ignored videos are shown only by the Ignored status filter, as they can only be restored.
          get ignoredView() {
            return this.statusFilter === 'Ignored';
          },

          isIgnored(video) {
            return video.download_status.status === 'Ignored';
          },

          get viewVideos() {
            return this.videos.filter(v => this.isIgnored(v) === this.ignoredView);
          },

          // Whether the video is in the selected channel and channel URL, whatever its status.
          inScope(video) {
            return (this.channelFilter === '' || String(video.channel_id) === this.channelFilter) &&
              (this.urlFilter === '' || String(video.channel_url_id) === this.urlFilter);
          },

          // Channels with available videos, and their counts.
          get channelOptions() {
            const byID = new Map();
            for (const v of this.viewVideos) {
              const ch = byID.get(v.channel_id) || { id: String(v.channel_id), name: v.channel_name, count: 0 };
              ch.count++;
              byID.set(v.channel_id, ch);
            }
            return [...byID.values()].sort((a, b) => a.name.localeCompare(b.name));
          },

          get channelVideos() {
            if (this.channelFilter === '') return this.viewVideos;
            return this.viewVideos.filter(v => String(v.channel_id) === this.channelFilter);
          },

          // The selected channel's URLs with available videos, and their counts.
          get urlOptions() {
            const byID = new Map();
            for (const v of this.channelVideos) {
              const u = byID.get(v.channel_url_id) || { id: String(v.channel_url_id), url: v.channel_url, count: 0 };
              u.count++;
              byID.set(v.channel_url_id, u);
            }
            return [...byID.values()];
          },

          // The selected channel URL's videos, before the status and title filters.
          get urlVideos() {
            if (this.urlFilter === '') return this.channelVideos;
            return this.channelVideos.filter(v => String(v.channel_url_id) === this.urlFilter);
          },

          // How many of the selected channel URL's videos have the download status.
          statusCount(status) {
            return this.videos.filter(v => this.inScope(v) && v.download_status.status === status).length;
          },

          get notIgnoredCount() {
            return this.videos.filter(v => this.inScope(v) && !this.isIgnored(v)).length;
          },

          get filteredVideos() {
            let list = this.urlVideos;
            if (this.statusFilter !== '') {
              list = list.filter(v => v.download_status.status === this.statusFilter);
            }
            const title = this.titleFilter.trim().toLowerCase();
            if (title) {
              list = list.filter(v => (v.title || '').toLowerCase().includes(title));
            }
            // The server sends newest first. Videos without a known duration go last when sorting by it, and equal
            // durations stay newest first.
            switch (this.sortOrder) {
              case 'oldest':
                return [...list].reverse();
              case 'longest':
                return [...list].sort((a, b) => (b.duration || -1) - (a.duration || -1));
              case 'shortest':
                return [...list].sort((a, b) => (a.duration || Infinity) - (b.duration || Infinity));
              default:
                return list;
            }
          },

          get selectedCount() {
            return Object.keys(this.selected).length;
          },

          filterChanged() {
            this.currentPage = 1;
            this.lastClickedIndex = null;
            // Ignored videos can only be restored, and others never, so selections don't carry between the two.
            for (const [id, v] of Object.entries(this.selected)) {
              if (this.isIgnored(v) !== this.ignoredView) delete this.selected[id];
            }
            const params = new URLSearchParams();
            if (this.channelFilter) params.set('channel', this.channelFilter);
            if (this.urlFilter) params.set('url', this.urlFilter);
            if (this.titleFilter.trim()) params.set('q', this.titleFilter.trim());
            if (this.statusFilter) params.set('status', this.statusFilter);
            const query = params.toString();
            history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
          },

          // A click toggles one video; shift-click selects just the videos back to the last click, ctrl/cmd+shift adds them.
          toggle(video, index, event) {
            if (event.shiftKey && this.lastClickedIndex !== null) {
              if (!event.ctrlKey && !event.metaKey) this.selected = {};
              const start = Math.min(this.lastClickedIndex, index);
              const end = Math.max(this.lastClickedIndex, index);
              for (const v of this.filteredVideos.slice(start, end + 1)) {
                this.setSelected(v, true);
              }
              if (event.target.type === 'checkbox') event.target.checked = true;
            } else {
              this.setSelected(video, !this.selected[video.id]);
              this.lastClickedIndex = index;
            }
          },

          setSelected(video, select) {
            if (select) {
              this.selected[video.id] = video;
            } else {
              delete this.selected[video.id];
            }
          },

          selectPage() {
            this.paginatedVideos.forEach(v => this.setSelected(v, true));
          },

          selectAllFiltered() {
            this.filteredVideos.forEach(v => this.setSelected(v, true));
          },

          // Downloads, dismisses or restores the selected videos, sent per channel.
          async act(action) {
            const chosen = Object.values(this.selected);
            if (chosen.length === 0) return;
            if (action === 'dismiss' && !confirm(`Dismiss ${chosen.length} video(s)? Crawls won't show them again.`)) return;

            const byChannel = new Map();
            for (const v of chosen) {
              byChannel.set(v.channel_id, [...(byChannel.get(v.channel_id) || []), v.id]);
            }

            this.working = true;
            const errors = [];
            for (const [channelID, ids] of byChannel) {
              try {
                const response = await fetch(`/api/v1/channels/${channelID}/available`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action, video_ids: ids })
                });
                if (!response.ok) {
                  throw new Error(await response.text() || response.statusText);
                }
              } catch (err) {
                errors.push(err.message);
              }
            }
            this.working = false;
            this.selected = {};
            await this.refreshAfterAction();
            if (errors.length > 0) {
              alert(`Some videos could not be updated:\n\n${errors.join('\n')}`);
            }
          },

          // Reloads the list, keeping the filters and page valid.
          async refreshAfterAction() {
            this.lastClickedIndex = null;

            await this.loadVideos();
            if (this.channelFilter !== '' && !this.channelOptions.some(c => c.id === this.channelFilter)) {
              this.channelFilter = '';
              this.urlFilter = '';
              this.filterChanged();
            }
            if (this.currentPage > this.totalPages) {
              this.currentPage = Math.max(1, this.totalPages);
            }
          },

          get totalPages() {
            return Math.ceil(this.filteredVideos.length / this.itemsPerPage);
          },

          get startIndex() {
            return (this.currentPage - 1) * this.itemsPerPage;
          },

          get endIndex() {
            return this.startIndex + this.itemsPerPage;
          },

          get paginatedVideos() {
            return this.filteredVideos.slice(this.startIndex, this.endIndex);
          },

          get visiblePages() {
            const pages = [];
            const maxVisible = 5;
            let startPage = Math.max(1, this.currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(this.totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) {
              startPage = Math.max(1, endPage - maxVisible + 1);
            }
            for (let i = startPage; i <= endPage; i++) {
              pages.push(i);
            }
            return pages;
          },

          goToPage(page) {
            if (page >= 1 && page <= this.totalPages) {
              this.currentPage = page;
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          },

          shortURL(url) {
            if (!url) return '';
            try {
              const u = new URL(url);
              return (u.hostname.replace(/^www\./, '') + u.pathname).replace(/\/$/, '');
            } catch {
              return url;
            }
          },

          formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = String(seconds % 60).padStart(2, '0');
            return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
          },

          // Shows the upload date, or when the crawl found the video if the listing had no date.
          formatDate(uploadDate, foundDate) {
            const upload = this.parseDate(uploadDate, true);
            if (upload) return this.relativeDay(upload);
            const found = this.parseDate(foundDate);
            return found ? `Found ${this.relativeDay(found).toLowerCase()}` : '';
          },

          // An upload date (dateOnly) is a calendar day, so its YYYY-MM-DD part is read as a local date.
          parseDate(dateString, dateOnly) {
            if (!dateString || dateString.startsWith('0001-01-01')) return null;
            const ymd = dateOnly && /^(\d{4})-(\d{2})-(\d{2})/.exec(dateString);
            const date = ymd ? new Date(+ymd[1], ymd[2] - 1, +ymd[3]) : new Date(dateString);
            return isNaN(date.getTime()) ? null : date;
          },

          relativeDay(date) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.floor((today - day) / 86400000);
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            return date.toLocaleDateString();
          }
        };
      }
    </script>
  </body>
