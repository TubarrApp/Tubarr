# Example site rules. Every setting is explained in site-rules-documentation.html (linked on the Site Rules page).

[[sites]]
domain = "bitchute.com"

  [[sites.selectors]]
  field = "title"
  selector = 'meta[itemprop="name"]'
  attr = "content"

  [[sites.selectors]]
  field = "description"
  selector = 'meta[name="description"]'
  attr = "content"

  [[sites.selectors]]
  field = "description"
  selector = 'meta[property="og:description"]'
  attr = "content"

  [[sites.selectors]]
  field = "release_date"
  selector = "span[data-v-3c3cf957]"
  attr = "data-v-3c3cf957"

[[sites]]
domain = "censored.tv"

  [[sites.selectors]]
  field = "title"
  selector = "#episode-container .episode-title"

  [[sites.selectors]]
  field = "description"
  selector = "#about .raised-content"

  [[sites.selectors]]
  field = "release_date"
  selector = "#about time"

  [[sites.selectors]]
  field = "direct_video_url"
  selector = "source[src*='master.m3u8']"
  attr = "src"

  [[sites.selectors]]
  field = "thumbnail"
  selector = "video-js[poster]"
  attr = "poster"

[[sites]]
domain = "odysee.com"

  [[sites.selectors]]
  field = "title"
  selector = "title"

  [[sites.selectors]]
  field = "description"
  selector = 'meta[name="description"]'
  attr = "content"

  [[sites.selectors]]
  field = "description"
  selector = 'meta[property="og:description"]'
  attr = "content"

  [[sites.selectors]]
  field = "release_date"
  selector = 'meta[property="og:video:release_date"]'
  attr = "content"

[[sites]]
domain = "rumble.com"
impersonate = "chrome"

# Uses FlareSolverr to grab cookies and user agent data for a given site.
#
# flaresolverr = true

  [[sites.selectors]]
  field = "title"
  selector = "title"

  [[sites.selectors]]
  field = "description"
  selector = 'meta[name="description"]'
  attr = "content"

  [[sites.selectors]]
  field = "description"
  selector = 'meta[property="og:description"]'
  attr = "content"

  [[sites.selectors]]
  field = "release_date"
  selector = ".media-description-info-stream-time [title]"
  attr = "title"

  [[sites.selectors]]
  field = "thumbnail"
  selector = "meta[property='og:image']"
  attr = "content"

  # As of October 2026, a Rumble video page holds its embed ID (e.g. "v7egj9a") in the JSON-LD's embedUrl, and the
  # player gets the HLS playlist from Rumble's embedJS API using that ID.
  [[sites.selectors]]
  field = "direct_video_url"
  selector = 'script[type="application/ld+json"]'
  json_path = "#.embedUrl"
  regex = 'embed/([a-z0-9]+)'

    [[sites.selectors.fetch]]
    url = "https://rumble.com/embedJS/u3/?request=video&ver=2&v={value}"
    json_path = "u.hls.url"

  # As of October 2026, Rumble lists a channel's videos as JSON inside the page's <rum-videos-grid> element.
  [sites.crawl]
  selector = 'rum-videos-grid script[type="application/json"]'
  json_path = 'items.#(object_type=="video")#.url'
  include = '^https?://([^/]+\.)?rumble\.com/v'
  exclude = '^https?://([^/]+\.)?rumble\.com/videos'
  strip_query = true
