<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
    </style>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Home | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
    <style>
      /* Scroll-snap carousel styles */
      .scroll-carousel {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        gap: 20px;
        padding: 0 4px;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }

      .scroll-carousel::-webkit-scrollbar {
        display: none; /* Chrome/Safari/Opera */
      }

      .scroll-carousel-item {
        scroll-snap-align: start;
        flex: 0 0 100%;
      }

      @media (min-width: 640px) {
        .scroll-carousel {
          gap: 20px;
        }
        .scroll-carousel-item {
          flex: 0 0 calc(50% - 10px);
        }
      }

      @media (min-width: 1024px) {
        .scroll-carousel {
          gap: 30px;
        }
        .scroll-carousel-item {
          flex: 0 0 calc(50% - 15px);
        }
      }

      @media (min-width: 1280px) {
        .scroll-carousel-item {
          flex: 0 0 calc(33.333% - 20px);
        }
      }

      .carousel-nav-button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        height: 40px;
        width: 40px;
        border-radius: 50%;
        border: 0.5px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.9);
        color: #374151;
        backdrop-filter: blur(10px);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s;
      }

      .carousel-nav-button:disabled {
        opacity: 0;
        pointer-events: none;
      }

      .carousel-nav-button:not(:disabled):hover {
        background: rgba(255, 255, 255, 1);
      }

      .carousel-nav-prev {
        left: 12px;
      }

      .carousel-nav-next {
        right: 12px;
      }

      @media (min-width: 640px) {
        .carousel-nav-prev {
          left: 16px;
        }
        .carousel-nav-next {
          right: 16px;
        }
      }

      .available-overlay { position: absolute; padding: 0.125rem 0.375rem; border-radius: 0.25rem; background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 0.75rem; line-height: 1rem; }

      /* Delete button hover effect */
      .delete-button-hover:hover {
        background-color: rgb(254 242 242); /* red-50 */
      }
      .dark .delete-button-hover:hover {
        background-color: rgba(127, 29, 29, 0.2); /* red-900/20 */
      }

      /* Notification dot for new content */
      .notification-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #d62c27; /* Tubarr brand red */
        animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse-dot {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body
    class="dark bg-gray-900"
    x-data="{ page: 'home', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Home" -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- include:header title="Home" -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">

            <!-- Channels Container -->
            <div
              x-data="channelsData()"
              x-init="loadChannels()"
              class="space-y-6"
            >
              <!-- Loading State -->
              <div x-show="loading" class="text-center py-12">
                <div class="inline-block h-12 w-12 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Loading channels...</p>
              </div>

              <!-- Error State -->
              <div x-show="error" class="rounded-2xl border border-red-200 bg-red-50 px-5 py-7 dark:border-red-800 dark:bg-red-900/20">
                <p class="text-red-600 dark:text-red-400" x-text="error"></p>
              </div>

              <!-- Stats Summary Card -->
              <div x-show="!loading && !error && channels.length > 0" class="rounded-2xl border border-gray-200 bg-white px-6 py-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="flex items-center justify-between">
                  <div>
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Overview</h3>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                      Tracking <span class="font-semibold text-brand-500 dark:text-brand-400" x-text="channels.length"></span> channel<span x-show="channels.length !== 1">s</span>
                    </p>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                      Blocking <span class="font-semibold text-brand-500 dark:text-brand-400" x-text="blockedDomainContextsCount"></span> domain context<span x-show="blockedDomainContextsCount !== 1">s</span>
                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <svg class="w-12 h-12 text-brand-500 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path>
                    </svg>
                  </div>
                </div>
              </div>


              <!-- No Channels State -->
              <div x-show="!loading && !error && channels.length === 0" class="rounded-2xl border border-gray-200 bg-white px-5 py-12 dark:border-gray-800 dark:bg-white/[0.03] text-center">
                <br>
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <h3 class="mt-4 text-lg font-semibold text-gray-800 dark:text-white/90">No channels yet</h3>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Get started by adding your first channel</p>
                <a href="add-channel.html" class="mt-4 inline-flex items-center px-4 py-2 bg-brand-500 text-white rounded-lg hover:bg-brand-600">
                  Add Channel
                </a>
                <br>
                <br>
              </div>

              <!-- Channels List -->
              <template x-for="channel in channels" :key="channel.id">
                <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
                  <!-- Channel Header -->
                  <div class="px-6 py-5 flex items-center justify-between">
                    <button
                      @click="toggleChannel(channel)"
                      class="flex items-center gap-3 hover:opacity-80 transition-opacity"
                    >
                      <svg
                        class="w-5 h-5 text-gray-500 dark:text-gray-400 transition-transform"
                        :class="channel.expanded ? 'rotate-90' : ''"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                      </svg>
                      <div class="text-left">
                        <div class="flex items-center gap-2">
                          <svg
                            x-show="channel.settings?.paused"
                            class="w-4 h-4 text-gray-500 dark:text-gray-400"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            title="Channel is paused"
                          >
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                          </svg>
                          <h3 class="text-base font-medium text-gray-800 dark:text-white/90" x-text="channel.name"></h3>
                          <span
                            x-show="channel.new_video_notification"
                            class="notification-dot"
                            title="New content in the last 24 hours"
                          ></span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                          <span x-show="!channel.expanded">Click to view latest videos</span>
                          <span x-show="channel.expanded">Latest 10 videos</span>
                        </p>
                      </div>
                    </button>
                    <div class="relative flex items-center gap-4">
                      <!-- Desktop Actions (hidden on mobile) -->
                      <button
                        @click="isCrawling(channel) ? stopQueue(channel) : crawlChannel(channel.id)"
                        :disabled="crawling === channel.id || isStopping(channel)"
                        :title="isCrawling(channel) ? 'Start nothing new for this channel, letting in-progress downloads and transcodes finish' : ''"
                        :class="isCrawling(channel) ? 'bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500' : 'bg-brand-600 hover:bg-brand-700 text-white'"
                        class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <svg x-show="crawling !== channel.id && !isCrawling(channel)" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <svg x-show="isCrawling(channel) && !isStopping(channel)" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        <svg x-show="crawling === channel.id || isStopping(channel)" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span x-text="isCrawling(channel) ? (isStopping(channel) ? 'Finishing in-progress...' : 'Stop Queue') : (crawling === channel.id ? 'Starting...' : 'Crawl Now')"></span>
                      </button>
                      <button
                        x-show="isCrawling(channel) || isMetarrActive(channel)"
                        @click="abortAll(channel)"
                        :disabled="aborting === channel.id"
                        title="Stop everything for this channel now, including in-progress downloads and transcodes"
                        class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-white rounded-lg transition-colors bg-error-500 hover:bg-error-600 disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <svg x-show="aborting !== channel.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        <span x-text="aborting === channel.id ? 'Aborting...' : 'Abort All'"></span>
                      </button>
                      <a
                        x-show="isMetarrActive(channel)"
                        :href="`post-processing.html?channel=${channel.id}`"
                        title="View and cancel this channel's post-processing"
                        class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-lg transition-colors border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
                      >
                        Post-processing
                      </a>
                      <button
                        @click="ignoreCrawlChannel(channel.id)"
                        :disabled="ignoring === channel.id || isCrawling(channel)"
                        class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <svg x-show="ignoring !== channel.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <svg x-show="ignoring === channel.id" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span x-text="ignoring === channel.id ? 'Ignoring...' : 'Ignore to Date'"></span>
                      </button>
                      <!-- Removed per-channel Active Downloads link -->

                      <!-- Mobile Menu Button -->
                      <button
                        @click.stop="toggleActionsMenu(channel.id)"
                        class="md:hidden inline-flex items-center gap-1 px-3 py-2 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
                      >
                        <span class="text-sm font-medium">Actions</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                      </button>

                      <!-- Mobile Dropdown Menu -->
                      <div
                        x-show="actionsMenuOpen === channel.id"
                        @click.outside="actionsMenuOpen = null"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="transform opacity-0 scale-95"
                        x-transition:enter-end="transform opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="transform opacity-100 scale-100"
                        x-transition:leave-end="transform opacity-0 scale-95"
                        class="md:hidden absolute right-0 top-12 z-50 w-56 rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800"
                      >
                        <div class="py-1">
                          <button
                            @click="isCrawling(channel) ? stopQueue(channel) : crawlChannel(channel.id); actionsMenuOpen = null"
                            :disabled="crawling === channel.id || isStopping(channel)"
                            :title="isCrawling(channel) ? 'Start nothing new for this channel, letting in-progress downloads and transcodes finish' : ''"
                            :class="isCrawling(channel) ? 'text-error-600 dark:text-error-500' : 'text-gray-700 dark:text-gray-300'"
                            class="flex w-full items-center gap-2 px-4 py-2 text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed dark:hover:bg-gray-700"
                          >
                            <svg x-show="crawling !== channel.id && !isCrawling(channel)" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            <svg x-show="isCrawling(channel) && !isStopping(channel)" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            <svg x-show="crawling === channel.id || isStopping(channel)" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span x-text="isCrawling(channel) ? (isStopping(channel) ? 'Finishing in-progress...' : 'Stop Queue') : (crawling === channel.id ? 'Starting...' : 'Crawl Now')"></span>
                          </button>
                          <button
                            x-show="isCrawling(channel) || isMetarrActive(channel)"
                            @click="abortAll(channel); actionsMenuOpen = null"
                            :disabled="aborting === channel.id"
                            title="Stop everything for this channel now, including in-progress downloads and transcodes"
                            class="flex w-full items-center gap-2 px-4 py-2 text-sm text-error-600 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed dark:text-error-500 dark:hover:bg-gray-700"
                          >
                            <svg x-show="aborting !== channel.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            <span x-text="aborting === channel.id ? 'Aborting...' : 'Abort All'"></span>
                          </button>
                          <a
                            x-show="isMetarrActive(channel)"
                            :href="`post-processing.html?channel=${channel.id}`"
                            class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
                          >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span>Post-processing</span>
                          </a>
                          <button
                            @click="ignoreCrawlChannel(channel.id); actionsMenuOpen = null"
                            :disabled="ignoring === channel.id || isCrawling(channel)"
                            class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed dark:text-gray-300 dark:hover:bg-gray-700"
                          >
                            <svg x-show="ignoring !== channel.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <svg x-show="ignoring === channel.id" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span x-text="ignoring === channel.id ? 'Ignoring...' : 'Ignore to Date'"></span>
                          </button>
                          <!-- Removed per-channel Active Downloads link -->
                          <div class="border-t border-gray-200 dark:border-gray-700"></div>
                          <button
                            @click="editChannel(channel.id); actionsMenuOpen = null"
                            class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
                          >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                            Edit Channel
                          </button>
                          <button
                            @click="togglePauseChannel(channel.id, channel.settings?.paused); actionsMenuOpen = null"
                            :disabled="togglingPause === channel.id"
                            class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed dark:text-gray-300 dark:hover:bg-gray-700"
                          >
                            <svg x-show="togglingPause !== channel.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path x-show="channel.settings?.paused" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                              <path x-show="!channel.settings?.paused" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <svg x-show="togglingPause === channel.id" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span x-text="togglingPause === channel.id ? 'Toggling...' : (channel.settings?.paused ? 'Resume Channel' : 'Pause Channel')"></span>
                          </button>
                          <button
                            @click="deleteChannel(channel.id, channel.name); actionsMenuOpen = null"
                            class="delete-button-hover flex w-full items-center gap-2 px-4 py-2 text-sm text-red-600 dark:text-red-400"
                          >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <script>
      // Alpine.js component for channels data
      function channelsData() {
        return {
          channels: [],
          loading: true,
          error: null,
          crawling: null,
          aborting: null,
          activity: { crawling: [], stopping: [], metarr: [] },
          activityTimer: null,
          ignoring: null,
          togglingPause: null,
          actionsMenuOpen: null,
          blockedDomainContextsCount: 0,
          crawlConcurrency: 0,
          savingCrawl: false,
          crawlSaved: false,
          globalDownloadLimit: 0,
          savingLimit: false,
          limitSaved: false,
          availableVideos: {}, // Channel ID -> videos waiting to be chosen, newest first.

          async loadAvailableVideos() {
            try {
              const response = await fetch('/api/v1/videos/available');
              if (!response.ok) return;
              const byChannel = {};
              for (const v of await response.json() || []) {
                (byChannel[v.channel_id] ||= []).push(v);
              }
              this.availableVideos = byChannel;
            } catch (err) {
              console.error('Error loading available videos:', err);
            }
          },

          downloadingAvailable: [], // IDs of available videos whose download request is in flight.

          // Downloads one available video, then refreshes the list it's removed from.
          async downloadAvailable(channel, video) {
            this.downloadingAvailable.push(video.id);
            try {
              const response = await fetch(`/api/v1/channels/${channel.id}/available`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'download', video_ids: [video.id] })
              });
              if (!response.ok) {
                throw new Error(await response.text() || response.statusText);
              }
              await this.loadAvailableVideos();
            } catch (err) {
              alert(`Failed to download "${video.title}": ${err.message}`);
            } finally {
              this.downloadingAvailable = this.downloadingAvailable.filter(id => id !== video.id);
            }
          },

          // Shows the upload date, or when the crawl found the video if the listing had no date.
          availableDate(video) {
            const known = (d) => d && !d.startsWith('0001-01-01');
            if (known(video.upload_date)) return this.formatDate(video.upload_date);
            return known(video.created_at) ? `Found ${this.formatDate(video.created_at).toLowerCase()}` : '';
          },

          formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = String(seconds % 60).padStart(2, '0');
            return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
          },

          async loadChannels() {
            try {
              const response = await fetch('/api/v1/channels/all');
              if (!response.ok) {
                throw new Error('Failed to fetch channels');
              }

              this.channels = await response.json();

              // Initialize channel state without loading videos
              for (let channel of this.channels) {
                channel.videos = [];
                channel.videosLoading = false;
                channel.expanded = false;
                channel.videosLoaded = false;
              }

              // Track running crawls/downloads.
              this.loadActivity();
              if (!this.activityTimer) {
                this.activityTimer = setInterval(() => this.loadActivity(), 3000);
              }

              // Load blocked domains count and global settings
              this.loadAvailableVideos();
              this.loadBlockedDomainsCount();
              this.loadCrawlConcurrency();
              this.loadGlobalDownloadLimit();

              this.loading = false;
            } catch (err) {
              this.error = err.message;
              this.loading = false;
            }
          },

          async loadBlockedDomainsCount() {
            try {
              const response = await fetch('/api/v1/blocked-domains');
              if (!response.ok) {
                console.error('Failed to fetch blocked domains');
                return;
              }

              const blockedDomains = await response.json();

              // Count total contexts across all domains
              let totalContexts = 0;
              for (let domain of blockedDomains) {
                if (domain.contexts) {
                  totalContexts += Object.keys(domain.contexts).length;
                }
              }

              this.blockedDomainContextsCount = totalContexts;
            } catch (err) {
              console.error('Error loading blocked domains count:', err);
              this.blockedDomainContextsCount = 0;
            }
          },

          async loadCrawlConcurrency() {
            try {
              const response = await fetch('/api/v1/settings/crawl-concurrency');
              if (!response.ok) {
                console.error('Failed to fetch crawl concurrency');
                return;
              }
              const data = await response.json();
              this.crawlConcurrency = data.limit || 0;
            } catch (err) {
              console.error('Error loading crawl concurrency:', err);
            }
          },

          async updateCrawlConcurrency() {
            this.savingCrawl = true;
            this.crawlSaved = false;
            try {
              const response = await fetch('/api/v1/settings/crawl-concurrency', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ limit: this.crawlConcurrency })
              });
              if (!response.ok) {
                throw new Error('Failed to update');
              }
              this.crawlSaved = true;
              setTimeout(() => { this.crawlSaved = false; }, 2000);
            } catch (err) {
              console.error('Error updating crawl concurrency:', err);
            } finally {
              this.savingCrawl = false;
            }
          },

          async loadGlobalDownloadLimit() {
            try {
              const response = await fetch('/api/v1/settings/global-download-concurrency');
              if (!response.ok) {
                console.error('Failed to fetch global download limit');
                return;
              }
              const data = await response.json();
              this.globalDownloadLimit = data.limit || 0;
            } catch (err) {
              console.error('Error loading global download limit:', err);
            }
          },

          async updateGlobalDownloadLimit() {
            this.savingLimit = true;
            this.limitSaved = false;
            try {
              const response = await fetch('/api/v1/settings/global-download-concurrency', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ limit: this.globalDownloadLimit })
              });
              if (!response.ok) {
                throw new Error('Failed to update');
              }
              this.limitSaved = true;
              setTimeout(() => { this.limitSaved = false; }, 2000);
            } catch (err) {
              console.error('Error updating global download limit:', err);
            } finally {
              this.savingLimit = false;
            }
          },

          async toggleChannel(channel) {
            channel.expanded = !channel.expanded;

            // Refresh available videos, which crawls may have changed since the page loaded.
            if (channel.expanded) {
              this.loadAvailableVideos();
            }

            // If expanding the channel and there's a new video notification, mark it as seen
            if (channel.expanded && channel.new_video_notification) {
              this.markNotificationSeen(channel);
            }

            // Load videos on first expand
            if (channel.expanded && !channel.videosLoaded) {
              channel.videosLoading = true;
              this.loadChannelVideos(channel);
            }
          },

          async markNotificationSeen(channel) {
            // Immediately remove the notification dot for better UX
            channel.new_video_notification = false;

            try {
              const response = await fetch(`/api/v1/channels/${channel.id}/notification-seen`, {
                method: 'POST'
              });

              if (!response.ok) {
                console.error('Failed to mark notification as seen');
                // Don't revert the UI change even if the backend call fails
              }
            } catch (err) {
              console.error('Error marking notification as seen:', err);
              // Don't revert the UI change even if the backend call fails
            }
          },

          async loadChannelVideos(channel) {
            try {
              const response = await fetch(`/api/v1/channels/${channel.id}/latest-downloads`);
              if (!response.ok) {
                throw new Error('Failed to fetch videos');
              }

              const videos = await response.json();
              channel.videos = videos || [];
              channel.videosLoading = false;
              channel.videosLoaded = true;
            } catch (err) {
              console.error(`Failed to load videos for channel ${channel.name}:`, err);
              channel.videosLoading = false;
              channel.videosLoaded = true; // Mark as loaded even on error to prevent retries
            }
          },

          scrollCarousel(channelId, direction) {
            const carousel = document.getElementById(`carousel-${channelId}`);
            if (!carousel) return;

            const scrollAmount = carousel.offsetWidth * 0.8; // Scroll by 80% of container width
            const newScrollLeft = direction === 'next'
              ? carousel.scrollLeft + scrollAmount
              : carousel.scrollLeft - scrollAmount;

            carousel.scrollTo({
              left: newScrollLeft,
              behavior: 'smooth'
            });
          },

          canScrollCarousel(channelId, direction) {
            const carousel = document.getElementById(`carousel-${channelId}`);
            if (!carousel) return false;

            if (direction === 'prev') {
              return carousel.scrollLeft > 0;
            } else {
              return carousel.scrollLeft < carousel.scrollWidth - carousel.offsetWidth - 10;
            }
          },

          toggleActionsMenu(channelId) {
            this.actionsMenuOpen = this.actionsMenuOpen === channelId ? null : channelId;
          },

          editChannel(channelId) {
            window.location.href = `edit-channel.html?id=${channelId}`;
          },

          async deleteChannel(channelId, channelName) {
            if (!confirm(`Are you sure you want to delete the channel "${channelName}"? This action cannot be undone.`)) {
              return;
            }

            try {
              const response = await fetch(`/api/v1/channels/${channelId}/delete`, {
                method: 'DELETE'
              });

              if (!response.ok) {
                throw new Error(`Failed to delete channel: ${response.statusText}`);
              }

              // Reload channels after successful deletion
              this.loading = true;
              await this.loadChannels();
            } catch (err) {
              this.error = err.message || 'Failed to delete channel';
              console.error('Error deleting channel:', err);
            }
          },

          formatDate(dateString) {
            if (!dateString) return 'Unknown';

            // Parse the date ensuring proper timezone handling
            // If the date doesn't have a timezone indicator, treat it as UTC
            let dateStr = dateString;
            if (!dateStr.endsWith('Z') && !dateStr.includes('+') && !dateStr.includes('T')) {
              // Date-only format, already treated as UTC by spec
              dateStr = dateString;
            } else if (dateStr.includes('T') && !dateStr.endsWith('Z') && !dateStr.includes('+') && !dateStr.includes('-', 10)) {
              // Has time but no timezone, assume UTC
              dateStr = dateString + 'Z';
            }

            const date = new Date(dateStr);

            // Validate the date
            if (isNaN(date.getTime())) {
              return 'Unknown';
            }

            // Compare dates at day-level precision (metadata typically only has date, not time)
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const uploadDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffMs = today - uploadDate;
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffDays === 0) {
              return 'Today';
            } else if (diffDays === 1) {
              return 'Yesterday';
            } else if (diffDays < 7) {
              return `${diffDays} days ago`;
            } else {
              return date.toLocaleDateString();
            }
          },

          async loadActivity() {
            try {
              const response = await fetch('/api/v1/channels/activity');
              if (response.ok) {
                this.activity = await response.json();
              }
            } catch (err) {
              console.error('Error loading channel activity:', err);
            }
          },

          // Activity lists channel IDs, which unlike names can't change while a job runs.
          isCrawling(channel) {
            return this.activity.crawling.includes(channel.id) || this.isStopping(channel);
          },

          isStopping(channel) {
            return this.activity.stopping.includes(channel.id);
          },

          isMetarrActive(channel) {
            return this.activity.metarr.includes(channel.id);
          },

          async stopQueue(channel) {
            if (!confirm(`Stop the queue for "${channel.name}"?\n\nNothing new will start: crawling stops, and queued downloads are canceled. In-progress downloads and transcodes will finish. Downloaded videos not yet transcoded can be finished later with Run Metarr.`)) return;
            await this.postStop(channel, 'stop-queue');
          },

          async abortAll(channel) {
            if (!confirm(`Abort everything for "${channel.name}"?\n\nCrawling, queued and in-progress downloads, and running transcodes will all be stopped now. Downloads are picked up by the next crawl, and transcodes can be finished later with Run Metarr.`)) return;
            this.aborting = channel.id;
            try {
              await this.postStop(channel, 'abort');
              // Processes wind down asynchronously, keep "Aborting..." until they stop.
              while (this.isCrawling(channel) || this.isMetarrActive(channel)) {
                await new Promise(r => setTimeout(r, 1000));
                await this.loadActivity();
              }
            } finally {
              this.aborting = null;
            }
          },

          async postStop(channel, action) {
            try {
              const response = await fetch(`/api/v1/channels/${channel.id}/${action}`, { method: 'POST' });
              if (!response.ok && response.status !== 409) {
                const errorText = await response.text();
                throw new Error(errorText || 'Request failed');
              }
              await this.loadActivity();
            } catch (err) {
              alert(`Failed to stop: ${err.message}`);
            }
          },

          async crawlChannel(channelId) {
            if (this.crawling) return;

            this.crawling = channelId;

            try {
              const response = await fetch(`/api/v1/channels/${channelId}/crawl`, {
                method: 'POST'
              });

              if (!response.ok && response.status !== 409) { // 409: a crawl is already running, the message says so.
                throw new Error('Failed to start crawl');
              }

              const data = await response.json();
              await this.loadActivity();
              alert(data.message || 'Channel crawl started successfully');
            } catch (err) {
              alert(`Failed to start crawl: ${err.message}`);
            } finally {
              this.crawling = null;
            }
          },

          async ignoreCrawlChannel(channelId) {
            if (this.ignoring) return;

            this.ignoring = channelId;

            try {
              const response = await fetch(`/api/v1/channels/${channelId}/ignore-crawl`, {
                method: 'POST'
              });

              if (!response.ok && response.status !== 409) { // 409: a crawl is already running, the message says so.
                throw new Error('Failed to ignore uploads to date');
              }

              const data = await response.json();
              alert(data.message || 'All uploads to date have been ignored');
            } catch (err) {
              alert(`Failed to ignore uploads: ${err.message}`);
            } finally {
              this.ignoring = null;
            }
          },

          async togglePauseChannel(channelId, currentPausedState) {
            if (this.togglingPause) return;

            this.togglingPause = channelId;

            try {
              const response = await fetch(`/api/v1/channels/${channelId}/toggle-pause`, {
                method: 'POST'
              });

              if (!response.ok) {
                throw new Error('Failed to toggle pause state');
              }

              const data = await response.json();

              // Update the channel's paused state in the local data
              const channel = this.channels.find(c => c.id === channelId);
              if (channel) {
                if (!channel.settings) {
                  channel.settings = {};
                }
                channel.settings.paused = data.paused;
              }

              alert(data.message || 'Channel pause state updated successfully.');
            } catch (err) {
              alert(`Failed to toggle pause state: ${err.message}`);
            } finally {
              this.togglingPause = null;
            }
          }
        };
      }
    </script>

    <script defer src="bundle.js"></script>
  </body>
