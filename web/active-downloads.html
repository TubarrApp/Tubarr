<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
      .active-downloads-table {
        width: 100%;
      }
      .active-downloads-table .video-col {
        width: 32%;
      }
      .active-downloads-table .channel-col {
        width: 12%;
      }
      .active-downloads-table .status-col {
        width: 12%;
      }
      .active-downloads-table .progress-col {
        width: 32%;
      }
      .video-text {
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .scrollable-text {
        display: block;
        max-width: 100%;
        overflow-x: hidden;
      }
      .scrollable-text-content {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 100%;
        white-space: nowrap;
      }
      .video-text::-webkit-scrollbar {
        height: 4px;
      }
      .scrollable-text::-webkit-scrollbar {
        height: 4px;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Active Downloads | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    x-data="{ page: 'activeDownloads', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    class="dark bg-gray-900"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Active Downloads" -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- include:header title="Active Downloads" -->

        <!-- ===== Main Content Start ===== -->
        <main x-data="downloadsData()" x-init="init()">
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">

            <!-- Error Message -->
            <div x-show="error" class="mb-6 rounded-lg bg-red-50 p-4 text-red-800 dark:bg-red-900/20 dark:text-red-400">
              <p x-text="error"></p>
            </div>

            <!-- Loading State -->
            <div x-show="loading" class="flex justify-center items-center py-12">
              <div class="h-12 w-12 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
            </div>

            <!-- Active Downloads List -->
            <div x-show="!loading && !error" class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden dark:border-gray-800 dark:bg-white/[0.03]">
              <!-- No Downloads Message -->
              <div x-show="downloads.length === 0" class="p-8 text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M12 3.25C12.4142 3.25 12.75 3.58579 12.75 4V12.1893L15.4697 9.46967C15.7626 9.17678 16.2374 9.17678 16.5303 9.46967C16.8232 9.76256 16.8232 10.2374 16.5303 10.5303L12.5303 14.5303C12.2374 14.8232 11.7626 14.8232 11.4697 14.5303L7.46967 10.5303C7.17678 10.2374 7.17678 9.76256 7.46967 9.46967C7.76256 9.17678 8.23744 9.17678 8.53033 9.46967L11.25 12.1893V4C11.25 3.58579 11.5858 3.25 12 3.25ZM3.25 15C3.66421 15 4 15.3358 4 15.75V18.5C4 18.9142 4.33579 19.25 4.75 19.25H19.25C19.6642 19.25 20 18.9142 20 18.5V15.75C20 15.3358 20.3358 15 20.75 15C21.1642 15 21.5 15.3358 21.5 15.75V18.5C21.5 19.7426 20.4926 20.75 19.25 20.75H4.75C3.50736 20.75 2.5 19.7426 2.5 18.5V15.75C2.5 15.3358 2.83579 15 3.25 15Z"
                  fill="currentColor"
                />
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">No active downloads</h3>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">If you have requested downloads, they will appear here once they start.</p>
              </div>

              <!-- Downloads Table -->
              <div x-show="downloads.length > 0" class="overflow-x-auto">
                <table class="w-full active-downloads-table">
                  <thead class="border-b border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800">
                    <tr>
                      <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 video-col">Video</th>
                      <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 channel-col">Channel</th>
                      <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 status-col">Status</th>
                      <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 progress-col">Progress</th>
                      <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-200 dark:divide-gray-800">
                    <template x-for="download in downloads" :key="download.id">
                      <tr>
                        <!-- Video Info -->
                        <td class="px-4 py-3 video-col">
                          <div class="flex items-center gap-3">
                            <img x-show="download.thumbnail_url" :src="download.thumbnail_url" :alt="download.title" class="h-12 w-20 object-cover rounded" />
                            <div class="flex-1 min-w-0 video-text">
                              <div class="scrollable-text">
                                <div class="scrollable-text-content">
                                  <p class="text-sm font-medium text-brand-600 dark:text-brand-400" x-text="download.title || 'Unknown'"></p>
                                  <p class="text-sm text-gray-500 dark:text-gray-400" x-text="download.url"></p>
                                </div>
                              </div>
                            </div>
                          </div>
                        </td>
                        <!-- Channel -->
                        <td class="px-4 py-3 channel-col">
                          <span class="text-sm text-gray-900 dark:text-white" x-text="download.channel_name || 'Unknown'"></span>
                        </td>
                        <!-- Status -->
                        <td class="px-4 py-3 status-col">
                          <span x-show="download.download_status.status === 'Downloading'" class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 dark:bg-blue-900/30" style="color: #1e40af;" x-bind:style="$root.classList.contains('dark') ? 'color: #93c5fd;' : 'color: #1e40af;'" x-text="download.download_status.status"></span>
                          <span x-show="download.download_status.status === 'Queued'" class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 dark:bg-yellow-900/30" style="color: #92400e;" x-bind:style="$root.classList.contains('dark') ? 'color: #fcd34d;' : 'color: #92400e;'" x-text="download.download_status.status"></span>
                          <span x-show="download.download_status.status === 'Failed'" class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 dark:bg-red-900/30" style="color: #991b1b;" x-bind:style="$root.classList.contains('dark') ? 'color: #fca5a5;' : 'color: #991b1b;'" x-text="download.download_status.status"></span>
                        </td>
                        <!-- Progress -->
                        <td class="px-4 py-3 progress-col">
                          <div class="flex items-center gap-2">
                            <div class="flex-1 bg-gray-200 rounded-full h-2 dark:bg-gray-700">
                              <div
                                class="bg-brand-500 h-2 rounded-full transition-all duration-300"
                                :style="`width: ${download.download_status.percentage}%`"
                              ></div>
                            </div>
                            <span class="text-sm text-gray-600 dark:text-gray-400 w-[3.5rem] text-right" x-text="`${download.download_status.percentage.toFixed(1)}%`"></span>
                          </div>
                        </td>
                        <!-- Actions -->
                        <td class="px-4 py-3">
                          <button
                            @click="cancelDownload(download.id)"
                            :disabled="cancelling === download.id"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed dark:text-red-400 dark:hover:text-red-300 dark:hover:bg-red-900/20"
                          >
                            <svg x-show="cancelling !== download.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <svg x-show="cancelling === download.id" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span x-text="cancelling === download.id ? 'Cancelling...' : 'Cancel'"></span>
                          </button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script defer src="bundle.js"></script>
    <script>
      function downloadsData() {
        return {
          downloads: [],
          loading: true,
          error: null,
          cancelling: null,
          pollInterval: null,

          init() {
            this.loadDownloads();

            // Poll for updates every 2 seconds
            this.pollInterval = setInterval(() => {
              this.loadDownloads(true);
            }, 2000);
          },

          async loadDownloads(silent = false) {
            if (!silent) {
              this.loading = true;
            }

            try {
              const response = await fetch('/api/v1/downloads');
              if (!response.ok) {
                throw new Error('Failed to fetch active downloads');
              }

              this.downloads = await response.json() || [];
              this.error = null;
            } catch (err) {
              this.error = err.message;
              // Stop polling if there's an error
              if (this.pollInterval) {
                clearInterval(this.pollInterval);
              }
            } finally {
              this.loading = false;
            }
          },

          async cancelDownload(videoId) {
            if (this.cancelling) return;

            if (!confirm('Are you sure you want to cancel this download?')) {
              return;
            }

            this.cancelling = videoId;

            // Find the download to get its channel ID
            const download = this.downloads.find(d => d.id === videoId);
            if (!download) {
              alert('Download not found');
              this.cancelling = null;
              return;
            }

            try {
              const response = await fetch(`/api/v1/channels/${download.channel_id}/cancel-download/${videoId}`, {
                method: 'DELETE'
              });

              if (!response.ok) {
                throw new Error('Failed to cancel download');
              }

              // Reload downloads after cancelling
              await this.loadDownloads();
            } catch (err) {
              alert(`Failed to cancel download: ${err.message}`);
            } finally {
              this.cancelling = null;
            }
          },

          destroy() {
            // Clean up polling interval when component is destroyed
            if (this.pollInterval) {
              clearInterval(this.pollInterval);
            }
          }
        };
      }
    </script>
  </body>
</html>
