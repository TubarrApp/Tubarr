<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
    </style>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Add Channel | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    x-data="{ page: 'addChannel', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    class="dark bg-gray-900"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Channels" -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- include:header title="Add Channel" -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">

            <!-- Form Start -->
            <div
              x-data="channelForm()"
              class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
            >
              <div class="px-5 py-4 sm:px-6 sm:py-5 border-b border-gray-200 dark:border-gray-800">
                <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
                  Create New Channel
                </h3>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                  Configure your channel settings, URLs, and processing options.
                </p>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
                  Already have a config file?
                  <a href="add-channel-from-files.html" class="text-brand-500 hover:text-brand-600 font-medium">
                    Load from file instead
                  </a>
                </p>
              </div>

              <form @submit.prevent="submitForm" class="p-5 sm:p-6 space-y-6">
                <!-- Error Display -->
                <div x-show="error" x-text="error" class="p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg dark:bg-red-900/20 dark:border-red-800 dark:text-red-400"></div>

                <!-- Success Display -->
                <div x-show="success" x-text="success" class="p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg dark:bg-green-900/20 dark:border-green-800 dark:text-green-400"></div>

                <!-- Basic Info -->
                <div class="space-y-4">
                  <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90">Basic Information</h4>

                  <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                      Channel Name <span class="text-red-500">*</span>
                    </label>
                    <input
                      type="text"
                      x-model="formData.name"
                      required
                      placeholder="My Channel"
                      class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                    />
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                      Profile
                    </label>
                    <select
                      x-model="formData.profile_id"
                      @change="useProfileDefaults()"
                      class="w-full h-11 rounded-lg border border-gray-300 bg-transparent pl-4 pr-10 py-2.5 text-sm text-gray-800 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                    >
                      <option value="">None</option>
                      <template x-for="p in profiles" :key="p.id">
                        <option :value="String(p.id)" x-text="p.name" :selected="String(p.id) === String(formData.profile_id)"></option>
                      </template>
                    </select>
                    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Fills in the settings this channel leaves blank. <a href="profiles.html" class="text-brand-500 hover:text-brand-600">Manage profiles</a></p>
                  </div>
                </div>

                <!-- Channel URLs -->
                <div class="space-y-4">
                  <div class="flex items-center justify-between">
                    <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90">Channel URLs</h4>
                    <button
                      type="button"
                      @click="addURL"
                      class="inline-flex items-center px-3 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 focus:ring-3 focus:ring-brand-500/50"
                    >
                      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                      </svg>
                      Add URL
                    </button>
                  </div>

                  <template x-for="(urlEntry, index) in formData.urls" :key="index">
                    <div class="p-4 border border-gray-200 rounded-lg dark:border-gray-700 space-y-4">
                      <div class="flex items-center justify-between">
                        <h5 class="text-sm font-medium text-gray-700 dark:text-gray-300" x-text="'URL ' + (index + 1)"></h5>
                        <button
                          type="button"
                          @click="removeURL(index)"
                          class="text-gray-700 dark:text-gray-300 text-sm"
                        >
                          Remove
                        </button>
                      </div>

                      <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                          URL
                        </label>
                        <input
                          type="url"
                          x-model="urlEntry.url"
                          placeholder="https://example.com/channel"
                          class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                        />
                      </div>

                      <!-- Auth Details Toggle -->
                      <div>
                        <label class="flex items-center cursor-pointer">
                          <input
                            type="checkbox"
                            x-model="urlEntry.hasAuth"
                            class="mr-2 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                          />
                          <span class="text-sm text-gray-700 dark:text-gray-300">Requires Authentication</span>
                        </label>
                      </div>

                      <!-- Auth Fields (shown when hasAuth is true) -->
                      <div x-show="urlEntry.hasAuth" class="space-y-3 pl-6 border-l-2 border-brand-500">
                        <div>
                          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Username
                          </label>
                          <input
                            type="text"
                            x-model="urlEntry.username"
                            placeholder="username"
                            class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                          />
                        </div>
                        <div>
                          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Password
                          </label>
                          <input
                            type="password"
                            x-model="urlEntry.password"
                            placeholder="••••••••"
                            class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                          />
                        </div>
                        <div>
                          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Login URL
                          </label>
                          <input
                            type="url"
                            x-model="urlEntry.loginURL"
                            placeholder="https://example.com/login"
                            class="w-full h-11 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                          />
                        </div>
                      </div>

                      <!-- Per-URL Settings Toggle -->
                      <div>
                        <label class="flex items-center cursor-pointer">
                          <input
                            type="checkbox"
                            x-model="urlEntry.hasCustomSettings"
                            class="mr-2 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                          />
                          <span class="text-sm text-gray-700 dark:text-gray-300">Custom Settings for this URL</span>
                        </label>
                      </div>

                      <!-- Pause State Toggle -->
                      <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 dark:text-gray-300 cursor-pointer">
                          <input
                            type="checkbox"
                            x-model="urlEntry.custom.paused"
                            class="mr-2 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                          />
                          <span>Pause this URL</span>
                        </label>
                      </div>

                      <!-- Profile -->
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Profile:</span>
                        <select x-model="urlEntry.profile_id" class="max-w-full h-11 rounded-lg border pl-4 pr-8 text-sm dark:bg-gray-900 dark:border-gray-600 dark:text-white/90">
                          <option value="">Same as channel</option>
                          <template x-for="p in profiles" :key="p.id">
                            <option :value="String(p.id)" x-text="p.name" :selected="String(p.id) === String(urlEntry.profile_id)"></option>
                          </template>
                        </select>
                      </div>

                      <!-- Auto Download Override -->
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">New videos:</span>
                        <select x-model="urlEntry.custom.auto_download" class="max-w-full h-11 rounded-lg border pl-4 pr-8 text-sm dark:bg-gray-900 dark:border-gray-600 dark:text-white/90">
                          <option value="" x-text="urlBoolHint(urlEntry, 'auto_download', 'Download automatically', 'List as available to choose from')"></option>
                          <option value="true">Download automatically</option>
                          <option value="false">List as available to choose from</option>
                        </select>
                      </div>

                      <!-- include:url-settings-fields -->
                    </div>
                  </template>
                </div>

                <!-- Tabs for Settings -->
                <div x-data="{ activeTab: 'basic' }" class="space-y-4">
                  <div class="border-b border-gray-200 dark:border-gray-700">
                    <nav class="flex flex-wrap">
                      <button
                        type="button"
                        @click="activeTab = 'basic'"
                        :class="activeTab === 'basic' ? 'border-brand-500 text-brand-600 dark:text-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'"
                        class="py-2 px-4 border-b-2 font-medium text-sm"
                      >
                        Basic Settings
                      </button>
                      <button
                        type="button"
                        @click="activeTab = 'ytdlp'"
                        :class="activeTab === 'ytdlp' ? 'border-brand-500 text-brand-600 dark:text-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'"
                        class="py-2 px-4 border-b-2 font-medium text-sm"
                      >
                        Yt-dlp Settings
                      </button>
                      <button
                        type="button"
                        @click="activeTab = 'metarr'"
                        :class="activeTab === 'metarr' ? 'border-brand-500 text-brand-600 dark:text-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'"
                        class="py-2 px-4 border-b-2 font-medium text-sm"
                      >
                        Post-processing
                      </button>
                      <button
                        type="button"
                        @click="activeTab = 'notifications'"
                        :class="activeTab === 'notifications' ? 'border-brand-500 text-brand-600 dark:text-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400'"
                        class="py-2 px-4 border-b-2 font-medium text-sm"
                      >
                        Notifications
                      </button>
                    </nav>
                  </div>

                  <!-- include:settings-fields -->

                  <!-- Notifications Tab -->
                  <div x-show="activeTab === 'notifications'" class="space-y-4">
                    <!-- include:notifications -->
                  </div>
                </div>

                <div>
                  <label class="flex items-center cursor-pointer">
                    <input
                      type="checkbox"
                      x-model="formData.ignore_run"
                      class="mr-2 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                    />
                    <span class="text-sm text-gray-700 dark:text-gray-300">Ignore All Videos to Date</span>
                  </label>
                </div>

                <!-- Form Actions -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                  <a
                    href="index.html"
                    class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700"
                  >
                    Cancel
                  </a>
                  <button
                    type="submit"
                    :disabled="submitting"
                    class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 focus:ring-3 focus:ring-brand-500/50 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <span x-show="!submitting">Create Channel</span>
                    <span x-show="submitting">Creating...</span>
                  </button>
                </div>
              </form>
            </div>
            <!-- Form End -->
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script defer src="bundle.js"></script>
    <script>
      function channelForm() {
        return {
          ...profileFields(),
          codecFields: ['ytdlp_preferred_video_codecs', 'ytdlp_preferred_audio_codecs'],
          formData: {
            name: '',
            profile_id: '',
            ignore_run: false,
            notifications: [],
            urls: [
              {
                url: '',
                hasAuth: false,
                username: '',
                password: '',
                loginURL: '',
                hasCustomSettings: false,
                profile_id: '',
                custom: {
                  paused: undefined,
                  use_global_cookies: undefined,
                  auto_download: '',
                  // Basic settings
                  video_directory: '',
                  json_directory: '',
                  download_concurrency: null,
                  crawl_freq: null,
                  download_retries: null,
                  max_filesize: '',
                  from_date: '',
                  to_date: '',
                  filter_file: '',
                  filters: '',
                  // Advanced settings
                  ytdlp_output_ext: '',
                  cookies_from_browser: '',
                  external_downloader: '',
                  external_downloader_args: '',
                  extra_ytdlp_video_args: '',
                  extra_ytdlp_meta_args: '',
                  extra_ytdlp_crawl_args: '',
                  move_ops_file: '',
                  move_ops: '',
                  ytdlp_preferred_video_codecs: '',
                  ytdlp_preferred_audio_codecs: '',
                  // Metarr settings
                  metarr_output_directory: '',
                  metarr_purge_metafile: '',
                  metarr_output_ext: '',
                  metarr_rename_style: '',
                  metarr_concurrency: null,
                  metarr_max_cpu_usage: null,
                  metarr_min_free_mem: '',
                  metarr_gpu: '',
                  metarr_transcode_gpu_node: '',
                  metarr_transcode_video_transcode_codecs: '',
                  metarr_transcode_audio_codecs: '',
                  metarr_transcode_quality: null,
                  metarr_extra_ffmpeg_args: '',
                  metarr_meta_ops_file: '',
                  metarr_meta_ops: '',
                  metarr_filtered_meta_ops_file: '',
                  metarr_filtered_meta_ops: '',
                  metarr_filename_ops_file: '',
                  metarr_filename_ops: '',
                  metarr_filtered_filename_ops_file: '',
                  metarr_filtered_filename_ops: ''
                }
              }
            ],
            settings: {
              video_directory: '',
              json_directory: '',
              download_concurrency: 1,
              crawl_freq: 30,
              download_retries: '',
              max_filesize: '',
              ytdlp_output_ext: '',
              cookies_from_browser: '',
              external_downloader: '',
              external_downloader_args: '',
              extra_ytdlp_video_args: '',
              extra_ytdlp_meta_args: '',
              extra_ytdlp_crawl_args: '',
              use_global_cookies: '',
              paused: false,
              auto_download: '',
              channel_config_file: '',
              from_date: '',
              to_date: '',
              filter_file: '',
              filters: '',
              move_ops_file: '',
              move_ops: '',
              ytdlp_preferred_video_codecs: '',
              ytdlp_preferred_audio_codecs: ''
            },
            metarr: {
              metarr_output_directory: '',
              metarr_purge_metafile: '',
              metarr_output_ext: '',
              metarr_rename_style: '',
              metarr_concurrency: '',
              metarr_max_cpu_usage: '',
              metarr_min_free_mem: '',
              metarr_gpu: '',
              metarr_transcode_gpu_node: '',
              metarr_transcode_video_transcode_codecs: '',
              metarr_transcode_audio_codecs: '',
              metarr_transcode_quality: '',
              metarr_extra_ffmpeg_args: '',
              metarr_filename_ops: '',
              metarr_filename_ops_file: '',
              metarr_filtered_filename_ops: '',
              metarr_filtered_filename_ops_file: '',
              metarr_meta_ops: '',
              metarr_meta_ops_file: '',
              metarr_filtered_meta_ops: '',
              metarr_filtered_meta_ops_file: ''
            }
          },
          error: '',
          success: '',
          submitting: false,
          globalPostProcessLimit: 0,
          globalDownloadLimit: 0,
          defaults: { download_concurrency: 1, crawl_freq: 30 },

          init() {
            this.loadGlobalLimits();
            this.loadProfiles();
          },

          // Clears the pre-filled defaults the chosen profile sets, so its values apply, and refills blanked ones it doesn't.
          useProfileDefaults() {
            const profileSettings = this.profileByID(this.formData.profile_id)?.settings || {};
            for (const [key, value] of Object.entries(this.defaults)) {
              const current = this.formData.settings[key];
              if (profileSettings[key] && current === value) {
                this.formData.settings[key] = null;
              } else if (!profileSettings[key] && (current === null || current === '')) {
                this.formData.settings[key] = value;
              }
            }
          },

          // A note when a limit is above the global one (0 = unlimited), which caps it.
          capNote(value, global) {
            return global > 0 && value > global ? `Capped at ${global} by the global limit (Settings)` : '';
          },

          // Placeholders showing what an empty post-processing concurrency falls back to.
          globalPostProcessHint() {
            return this.globalPostProcessLimit > 0 ? `Use global (${this.globalPostProcessLimit})` : 'Use global (unlimited)';
          },
          urlPostProcessHint() {
            const n = this.formData.metarr.metarr_concurrency;
            return n > 0 ? `Use channel (${n})` : this.globalPostProcessHint();
          },
          async loadGlobalLimits() {
            try {
              const [postProcess, download] = await Promise.all([
                fetch('/api/v1/settings/post-process-concurrency'),
                fetch('/api/v1/settings/global-download-concurrency')
              ]);
              if (postProcess.ok) this.globalPostProcessLimit = (await postProcess.json()).limit ?? 0;
              if (download.ok) this.globalDownloadLimit = (await download.json()).limit ?? 0;
            } catch (err) {
              console.error('Error loading global concurrency limits:', err);
            }
          },

          addURL() {
            this.formData.urls.push({
              url: '',
              hasAuth: false,
              username: '',
              password: '',
              loginURL: '',
              hasCustomSettings: false,
              Paused: false,
              profile_id: '',
              custom: {
                paused: undefined,
                use_global_cookies: undefined,
                auto_download: '',
                video_directory: '',
                json_directory: '',
                download_concurrency: null,
                crawl_freq: null,
                download_retries: null,
                max_filesize: '',
                from_date: '',
                to_date: '',
                filter_file: '',
                filters: '',
                ytdlp_output_ext: '',
                cookies_from_browser: '',
                external_downloader: '',
                external_downloader_args: '',
                extra_ytdlp_video_args: '',
                extra_ytdlp_meta_args: '',
                extra_ytdlp_crawl_args: '',
                move_ops_file: '',
                move_ops: '',
                ytdlp_preferred_video_codecs: '',
                ytdlp_preferred_audio_codecs: '',
                metarr_output_directory: '',
                metarr_purge_metafile: '',
                metarr_output_ext: '',
                metarr_rename_style: '',
                metarr_concurrency: null,
                metarr_max_cpu_usage: null,
                metarr_min_free_mem: '',
                metarr_gpu: '',
                metarr_transcode_gpu_node: '',
                metarr_transcode_video_transcode_codecs: '',
                metarr_transcode_audio_codecs: '',
                metarr_transcode_quality: null,
                metarr_extra_ffmpeg_args: '',
                metarr_meta_ops_file: '',
                metarr_meta_ops: '',
                metarr_filtered_meta_ops_file: '',
                metarr_filtered_meta_ops: '',
                metarr_filename_ops_file: '',
                metarr_filename_ops: '',
                metarr_filtered_filename_ops_file: '',
                metarr_filtered_filename_ops: ''
              }
            });
          },

          removeURL(index) {
            this.formData.urls.splice(index, 1);
          },

          async submitForm() {
            this.error = '';
            this.success = '';
            this.submitting = true;

            try {
              // Build the request payload matching the backend handler expectations
              const payload = {
                name: this.formData.name,
                urls: this.formData.urls.filter(u => u.url).map(u => u.url).join(' '),
                auth_details: this.buildAuthDetails()
              };
              if (this.formData.profile_id) {
                payload.profile_id = this.formData.profile_id;
              }

              // Add global settings (filter out null/empty values to allow clearing)
              Object.keys(this.formData.settings).forEach(key => {
                const value = this.formData.settings[key];
                if (value !== null && value !== undefined && value !== '') {
                  payload[key] = value;
                }
              });

              // Add global metarr settings (filter out null/empty values to allow clearing)
              Object.keys(this.formData.metarr).forEach(key => {
                const value = this.formData.metarr[key];
                if (value !== null && value !== undefined && value !== '') {
                  payload[key] = value;
                }
              });

              // Add notifications.
              if (this.formData.notifications.length > 0) {
                payload.notifications = notificationsJSON(this.formData.notifications);
              }

              // Build per-URL custom settings as JSON object
              const perURLSettings = this.buildPerURLSettingsJSON();
              if (Object.keys(perURLSettings).length > 0) {
                payload.url_settings = JSON.stringify(perURLSettings);
              }

              // Backend expects newline-separated operations to preserve values with spaces
              // No conversion needed - textareas already contain newline-separated values

              // Add ignore_run if checked (backend expects "true" string or absence)
              if (this.formData.ignore_run) {
                payload.ignore_run = 'true';
              }

              // Convert boolean to string for paused
              if (this.formData.settings.paused) {
                payload.paused = 'true';
              } else {
                delete payload.paused; // Remove false value
              }

              const response = await fetch('/api/v1/channels/add', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(payload)
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Failed to create channel');
              }

              this.success = 'Channel created successfully!';

              // Redirect after a short delay
              setTimeout(() => {
                window.location.href = 'add-channel.html';
              }, 1500);

            } catch (err) {
              this.error = err.message || 'An error occurred while creating the channel';
              console.error('Error creating channel:', err);
            } finally {
              this.submitting = false;
            }
          },

          buildAuthDetails() {
            // Build auth_details array based on URLs with authentication
            const authEntries = [];
            this.formData.urls.forEach(urlEntry => {
              if (urlEntry.hasAuth && urlEntry.username && urlEntry.loginURL) {
                authEntries.push({
                  channel_url: urlEntry.url,
                  username: urlEntry.username,
                  password: urlEntry.password || '',
                  login_url: urlEntry.loginURL
                });
              }
            });
            return authEntries.length > 0 ? JSON.stringify(authEntries) : '';
          },

          buildPerURLSettingsJSON() {
            // Build per-URL custom settings as structured JSON
            // Format: { "channel_url": { settings: {...}, metarr: {...} } }
            const perURL = {};
            const normalizeBool = (val) => {
              if (typeof val === 'boolean') {
                return val;
              }
              if (val === 'true') return true;
              if (val === 'false') return false;
              return undefined;
            };
            const hasValue = (value) => {
              if (value === null || value === undefined) {
                return false;
              }
              if (typeof value === 'boolean') {
                return true;
              }
              if (Array.isArray(value)) {
                return value.length > 0;
              }
              return value !== '';
            };
            const codecFields = this.codecFields;
            const toCodecArray = (value) => {
              if (Array.isArray(value)) {
                return value.map(v => (typeof v === 'string' ? v.trim() : v)).filter(Boolean);
              }
              if (typeof value === 'string') {
                return value
                  .split('\n')
                  .map(v => v.trim())
                  .filter(v => v);
              }
              return [];
            };

            this.formData.urls.forEach(urlEntry => {
              if (!urlEntry.url) return;

              const channelURL = urlEntry.url;
              const settings = {};
              const metarr = {};

              // Process Paused field (checkbox - always set as boolean)
              const pausedValue = normalizeBool(urlEntry.custom && urlEntry.custom.paused);
              if (typeof pausedValue === 'boolean') {
                settings.paused = pausedValue;
              }

              // Process Use Global Cookies field from dropdown (three states: inherit/''/true/false)
              if (urlEntry.custom && urlEntry.custom.use_global_cookies !== undefined && urlEntry.custom.use_global_cookies !== '') {
                if (urlEntry.custom.use_global_cookies === 'true') {
                  settings.use_global_cookies = true;
                } else if (urlEntry.custom.use_global_cookies === 'false') {
                  settings.use_global_cookies = false;
                }
                // If empty string, don't set (will be nil in Go)
              }

              // Process Auto Download override from dropdown (empty inherits from the channel)
              const autoDownloadValue = normalizeBool(urlEntry.custom && urlEntry.custom.auto_download);
              if (typeof autoDownloadValue === 'boolean') {
                settings.auto_download = autoDownloadValue;
              }

              // Process custom settings if enabled
              if (urlEntry.hasCustomSettings && urlEntry.custom) {
                // Process basic/advanced settings
                const settingsFields = [
                  'video_directory', 'json_directory', 'download_concurrency', 'crawl_freq',
                  'download_retries', 'max_filesize', 'from_date', 'to_date',
                  'filter_file', 'filters',
                  'ytdlp_output_ext', 'cookies_from_browser',
                  'external_downloader', 'external_downloader_args',
                  'extra_ytdlp_video_args', 'extra_ytdlp_meta_args', 'extra_ytdlp_crawl_args',
                  'move_ops_file', 'move_ops',
                  'ytdlp_preferred_video_codecs', 'ytdlp_preferred_audio_codecs'
                ];

                settingsFields.forEach(field => {
                  const value = urlEntry.custom[field];
                  if (hasValue(value)) {
                    if (codecFields.includes(field)) {
                      const codecs = toCodecArray(value);
                      if (codecs.length > 0) {
                        settings[field] = codecs;
                      }
                    } else if (typeof value === 'string' && value.includes('\n')) {
                      settings[field] = value.split('\n').map(v => v.trim()).filter(v => v).join('\n');
                    } else {
                      settings[field] = value;
                    }
                  }
                });

                // Process metarr settings
                const metarrFields = [
                  'metarr_output_directory', 'metarr_purge_metafile', 'metarr_output_ext', 'metarr_rename_style',
                  'metarr_concurrency', 'metarr_max_cpu_usage', 'metarr_min_free_mem',
                  'metarr_gpu', 'metarr_transcode_gpu_node', 'metarr_transcode_video_transcode_codecs', 'metarr_transcode_audio_codecs',
                  'metarr_transcode_quality',
                  'metarr_extra_ffmpeg_args', 'metarr_meta_ops', 'metarr_meta_ops_file',
                  'metarr_filename_ops', 'metarr_filename_ops_file',
                  'metarr_filtered_meta_ops', 'metarr_filtered_meta_ops_file',
                  'metarr_filtered_filename_ops', 'metarr_filtered_filename_ops_file'
                ];

                metarrFields.forEach(field => {
                  const value = urlEntry.custom[field];
                  if (hasValue(value)) {
                    // Keep newlines and trailing spaces, since an operation's value may end in one
                    if (typeof value === 'string' && value.includes('\n')) {
                      metarr[field] = value.split('\n').map(v => v.replace(/^\s+|\r$/g, '')).filter(v => v.trim()).join('\n');
                    } else {
                      metarr[field] = value;
                    }
                  }
                });
              }

              // Only add if there are overrides or a profile
              if (Object.keys(settings).length > 0 || Object.keys(metarr).length > 0 || urlEntry.profile_id) {
                perURL[channelURL] = {};
                if (urlEntry.profile_id) perURL[channelURL].profile_id = Number(urlEntry.profile_id);
                if (Object.keys(settings).length > 0) perURL[channelURL].settings = settings;
                if (Object.keys(metarr).length > 0) perURL[channelURL].metarr = metarr;
              }
            });

            return perURL;
          }
        };
      }
    </script>
  </body>
</html>
