<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
    </style>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Blocked Domains | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    class="dark bg-gray-900"
    x-data="blockedDomainsData()"
    @blocked-domains-updated.window="fetchBlockedDomains()"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Blocked Domains" -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- include:header title="Blocked Domains" -->

        <!-- ===== Main Content Start ===== -->
        <main class="p-4 md:p-6 2xl:p-10">
          <div class="mx-auto max-w-7xl">

            <!-- Blocked Domains Content Start -->
            <div
              class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
            >
              <div class="border-b border-gray-200 p-5 sm:px-6 dark:border-gray-700">
                <p class="text-sm text-gray-500 dark:text-gray-400">
                  Domains blocked due to bot detection. Blocks are context-specific and expire automatically.
                </p>
              </div>

              <div class="p-5 sm:p-6">
                <!-- Loading State -->
                <div x-show="loading" class="text-center py-12">
                  <div
                    class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
                  ></div>
                  <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">Loading blocked domains...</p>
                </div>

                <!-- Empty State -->
                <div x-show="!loading && blockedDomains.length === 0" class="text-center py-12">
                  <svg
                    class="mx-auto h-12 w-12 text-gray-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                  </svg>
                  <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">No blocked domains</h3>
                  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    All domains are currently accessible.
                  </p>
                </div>

                <div x-show="!loading && blockedDomains.length > 0">
                <!-- Filter -->
                <div class="flex flex-wrap items-center gap-4 pb-5">
                  <input
                    type="search"
                    x-model="domainFilter"
                    @input="lastClickedIndex = null"
                    placeholder="Filter by domain"
                    class="w-56 max-w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  />
                </div>

                <!-- Selection Bar -->
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-200 bg-gray-50 px-4 py-4 dark:border-gray-800 dark:bg-gray-800">
                  <div class="flex flex-wrap items-center gap-4 text-sm">
                    <span class="font-medium text-gray-900 dark:text-white">
                      <span x-text="selectedCount"></span> of <span x-text="filteredDomains.length"></span> selected
                    </span>
                    <button @click="selectAllFiltered()" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Select all</button>
                    <button x-show="selectedCount > 0" @click="selected = {}" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-gray-100">Clear</button>
                  </div>
                  <button
                    @click="unblockSelected()"
                    :disabled="selectedCount === 0 || working"
                    class="px-4 py-2 text-sm font-medium text-white rounded-lg bg-error-500 hover:bg-error-600 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    Unblock<span x-show="selectedCount > 0" x-text="` (${selectedCount})`"></span>
                  </button>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                  <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="border-b border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800">
                      <tr>
                        <th scope="col" class="w-10 px-4 py-3.5"></th>
                        <th
                          scope="col"
                          class="px-4 py-3.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200"
                        >
                          Domain
                        </th>
                        <th
                          scope="col"
                          class="px-4 py-3.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200"
                        >
                          Context
                        </th>
                        <th
                          scope="col"
                          class="px-4 py-3.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200"
                        >
                          Blocked At
                        </th>
                        <th
                          scope="col"
                          class="px-4 py-3.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200"
                        >
                          Time Remaining
                        </th>
                        <th
                          scope="col"
                          class="px-4 py-3.5 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200"
                        >
                          Actions
                        </th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-800">
                      <template x-for="(domain, i) in filteredDomains" :key="rowKey(domain)">
                        <tr @click="toggle(domain, i, $event)" class="cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
                          <td class="w-10 px-4 py-4">
                            <input
                              type="checkbox"
                              :checked="!!selected[rowKey(domain)]"
                              @click.stop="toggle(domain, i, $event)"
                              class="h-5 w-5 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                            />
                          </td>
                          <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">
                            <span x-text="domain.domain"></span>
                          </td>
                          <td class="px-4 py-4 whitespace-nowrap text-sm">
                            <span
                              x-show="domain.context === 'unauth'"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 dark:bg-red-900/30"
                              x-bind:style="$root.classList.contains('dark') ? 'color: #e4e7ec;' : 'color: #e4e7ec;'"
                              x-text="domain.contextLabel"
                            ></span>
                            <span
                              x-show="domain.context === 'cookie'"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 dark:bg-yellow-900/30"
                              x-bind:style="$root.classList.contains('dark') ? 'color: #fcd34d;' : 'color: #92400e;'"
                              x-text="domain.contextLabel"
                            ></span>
                            <span
                              x-show="domain.context === 'auth'"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 dark:bg-blue-900/30"
                              x-bind:style="$root.classList.contains('dark') ? 'color: #4ade80;' : 'color: #166534;'"
                              x-text="domain.contextLabel"
                            ></span>
                          </td>
                          <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                            <span x-text="domain.blockedAtFormatted"></span>
                          </td>
                          <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                            <span x-text="domain.timeRemaining"></span>
                          </td>
                          <td class="px-4 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button
                              @click.stop="unblockDomain(domain.domain, domain.context)"
                              x-bind:style="'color: #ef4444;'"
                              @mouseover="$event.target.style.color = '#f87171'"
                              @mouseout="$event.target.style.color = '#ef4444'"
                            >
                              Unblock
                            </button>
                          </td>
                        </tr>
                      </template>
                      <tr x-show="filteredDomains.length === 0">
                        <td colspan="6" class="px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">No domains match the filter.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                </div>
              </div>
            </div>
            <!-- Blocked Domains Content End -->
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script defer src="bundle.js"></script>
    <script>
      function blockedDomainsData() {
        return {
          page: 'blockedDomains',
          loaded: true,
          stickyMenu: false,
          sidebarToggle: false,
          scrollTop: false,
          loading: true,
          working: false,
          blockedDomains: [],
          domainFilter: '',
          selected: {},
          lastClickedIndex: null,

          init() {
            this.fetchBlockedDomains();
            // Refresh every 10 seconds
            setInterval(() => this.fetchBlockedDomains(), 10000);
          },

          async fetchBlockedDomains() {
            try {
              const response = await fetch('/api/v1/blocked-domains');
              if (!response.ok) {
                throw new Error('Failed to fetch blocked domains');
              }
              const data = await response.json();

              // Flatten the data structure for table display
              this.blockedDomains = [];
              data.forEach(item => {
                Object.keys(item.contexts).forEach(context => {
                  this.blockedDomains.push({
                    domain: item.domain,
                    context: context,
                    contextLabel: this.getContextLabel(context),
                    blockedAt: item.contexts[context],
                    blockedAtFormatted: this.formatDate(item.contexts[context]),
                    timeRemaining: item.time_remaining[context] || 'Calculating...'
                  });
                });
              });

              // Sort by blocked time, most recent first, then alphabetically
              this.blockedDomains.sort((a, b) => {
                const timeCompare = new Date(b.blockedAt) - new Date(a.blockedAt);
                if (timeCompare !== 0) {
                  return timeCompare;
                }
                // If times are the same, sort alphabetically by domain
                const domainCompare = a.domain.localeCompare(b.domain);
                if (domainCompare !== 0) {
                  return domainCompare;
                }
                // If domains are also the same, sort by context
                return a.context.localeCompare(b.context);
              });

              // Drop selections for blocks that expired or were removed.
              const current = {};
              for (const d of this.blockedDomains) {
                if (this.selected[this.rowKey(d)]) current[this.rowKey(d)] = d;
              }
              this.selected = current;
            } catch (error) {
              console.error('Error fetching blocked domains:', error);
            } finally {
              this.loading = false;
            }
          },

          async unblockDomain(domain, context) {
            if (!confirm(`Are you sure you want to unblock "${domain}" for ${this.getContextLabel(context)}?`)) {
              return;
            }

            try {
              const url = `/api/v1/blocked-domains/${encodeURIComponent(domain)}?context=${context}`;
              const response = await fetch(url, { method: 'DELETE' });

              if (!response.ok) {
                throw new Error('Failed to unblock domain');
              }

              // Refresh the list
              await this.fetchBlockedDomains();
            } catch (error) {
              console.error('Error unblocking domain:', error);
              alert('Failed to unblock domain. Please try again.');
            }
          },

          get filteredDomains() {
            const filter = this.domainFilter.trim().toLowerCase();
            if (!filter) return this.blockedDomains;
            return this.blockedDomains.filter(d => d.domain.toLowerCase().includes(filter));
          },

          get selectedCount() {
            return Object.keys(this.selected).length;
          },

          rowKey(d) {
            return `${d.domain}|${d.context}`;
          },

          // A click toggles one row; shift-click selects just the rows back to the last click, ctrl/cmd+shift adds them.
          toggle(domain, index, event) {
            if (event.shiftKey && this.lastClickedIndex !== null) {
              if (!event.ctrlKey && !event.metaKey) this.selected = {};
              const start = Math.min(this.lastClickedIndex, index);
              const end = Math.max(this.lastClickedIndex, index);
              for (const d of this.filteredDomains.slice(start, end + 1)) {
                this.setSelected(d, true);
              }
              if (event.target.type === 'checkbox') event.target.checked = true;
            } else {
              this.setSelected(domain, !this.selected[this.rowKey(domain)]);
              this.lastClickedIndex = index;
            }
          },

          setSelected(d, select) {
            if (select) {
              this.selected[this.rowKey(d)] = d;
            } else {
              delete this.selected[this.rowKey(d)];
            }
          },

          selectAllFiltered() {
            this.filteredDomains.forEach(d => this.setSelected(d, true));
          },

          async unblockSelected() {
            const chosen = Object.values(this.selected);
            if (chosen.length === 0) return;
            const what = chosen.length === 1 ? `"${chosen[0].domain}" for ${chosen[0].contextLabel}` : `${chosen.length} blocked domain contexts`;
            if (!confirm(`Unblock ${what}?`)) return;

            this.working = true;
            const failed = [];
            for (const d of chosen) {
              try {
                const url = `/api/v1/blocked-domains/${encodeURIComponent(d.domain)}?context=${d.context}`;
                const response = await fetch(url, { method: 'DELETE' });
                if (!response.ok) {
                  failed.push(`${d.domain} (${d.contextLabel})`);
                }
              } catch (error) {
                failed.push(`${d.domain} (${d.contextLabel})`);
              }
            }
            this.working = false;
            this.selected = {};
            this.lastClickedIndex = null;
            await this.fetchBlockedDomains();
            if (failed.length > 0) {
              alert(`Failed to unblock: ${failed.join(', ')}`);
            }
          },

          getContextLabel(context) {
            const labels = {
              'unauth': 'Unauthenticated',
              'cookie': 'Cookie Auth',
              'auth': 'Username/Password'
            };
            return labels[context] || context;
          },

          formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
          }
        };
      }
    </script>
  </body>
</html>
