<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
      .downloads-table { width: 100%; }
      .downloads-table .check-col { width: 2.5rem; }
      .downloads-table .video-col { width: 36%; }
      .downloads-table .channel-col { width: 18%; }
      .downloads-table .status-col { width: 14%; }
      .downloads-table .progress-col { width: 22%; }
      .scrollable-text { display: block; max-width: 100%; overflow-x: auto; scrollbar-width: thin; white-space: nowrap; }
      .scrollable-text::-webkit-scrollbar { height: 4px; }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Downloads | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    x-data="{ page: 'downloads', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    class="dark bg-gray-900"
  >
    <!-- ===== Preloader Start ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Downloads" -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- include:header title="Downloads" -->

        <!-- ===== Main Content Start ===== -->
        <main x-data="downloadsData()" x-init="init()">
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <div class="mb-6">
              <p class="text-sm text-gray-500 dark:text-gray-400">
                Videos being prepared or downloaded. Canceled videos return to the Available list, and their partial files are deleted.
              </p>
            </div>

            <!-- Error Message -->
            <div x-show="error" class="mb-6 rounded-lg bg-red-50 p-4 text-red-800 dark:bg-red-900/20 dark:text-red-400">
              <p x-text="error"></p>
            </div>

            <!-- Loading State -->
            <div x-show="loading" class="flex justify-center items-center py-12">
              <div class="h-12 w-12 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
            </div>

            <div x-show="!loading && !error" class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden dark:border-gray-800 dark:bg-white/[0.03]">
              <!-- No Downloads Message -->
              <div x-show="downloads.length === 0" class="p-8 text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M12 3.25C12.4142 3.25 12.75 3.58579 12.75 4V12.1893L15.4697 9.46967C15.7626 9.17678 16.2374 9.17678 16.5303 9.46967C16.8232 9.76256 16.8232 10.2374 16.5303 10.5303L12.5303 14.5303C12.2374 14.8232 11.7626 14.8232 11.4697 14.5303L7.46967 10.5303C7.17678 10.2374 7.17678 9.76256 7.46967 9.46967C7.76256 9.17678 8.23744 9.17678 8.53033 9.46967L11.25 12.1893V4C11.25 3.58579 11.5858 3.25 12 3.25ZM3.25 15C3.66421 15 4 15.3358 4 15.75V18.5C4 18.9142 4.33579 19.25 4.75 19.25H19.25C19.6642 19.25 20 18.9142 20 18.5V15.75C20 15.3358 20.3358 15 20.75 15C21.1642 15 21.5 15.3358 21.5 15.75V18.5C21.5 19.7426 20.4926 20.75 19.25 20.75H4.75C3.50736 20.75 2.5 19.7426 2.5 18.5V15.75C2.5 15.3358 2.83579 15 3.25 15Z"
                  fill="currentColor"
                />
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900 dark:text-white">No downloads</h3>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Any download jobs you initiated should appear here shortly.</p>
              </div>

              <div x-show="downloads.length > 0">
                <!-- Filters -->
                <div class="flex flex-wrap items-center gap-4 border-b border-gray-200 px-6 py-5 dark:border-gray-800">
                  <input
                    type="search"
                    x-model="titleFilter"
                    @input="filterChanged()"
                    placeholder="Filter by title"
                    class="w-56 max-w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  />

                  <select
                    x-model="channelFilter"
                    @change="urlFilter = ''; filterChanged()"
                    class="max-w-full rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All channels (${downloads.length})`"></option>
                    <template x-for="ch in channelOptions" :key="ch.id">
                      <option :value="ch.id" :selected="channelFilter === ch.id" x-text="`${ch.name} (${ch.count})`"></option>
                    </template>
                  </select>

                  <select
                    x-show="channelFilter !== '' && urlOptions.length > 1"
                    x-model="urlFilter"
                    @change="filterChanged()"
                    class="max-w-full rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All URLs (${channelDownloads.length})`"></option>
                    <template x-for="u in urlOptions" :key="u.id">
                      <option :value="u.id" :selected="urlFilter === u.id" x-text="`${shortURL(u.url)} (${u.count})`"></option>
                    </template>
                  </select>
                </div>

                <!-- Selection Bar -->
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-200 bg-gray-50 px-6 py-4 dark:border-gray-800 dark:bg-gray-800">
                  <div class="flex flex-wrap items-center gap-4 text-sm">
                    <span class="font-medium text-gray-900 dark:text-white">
                      <span x-text="selectedCount"></span> of <span x-text="filteredDownloads.length"></span> selected
                    </span>
                    <button @click="selectAllFiltered()" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Select all</button>
                    <button @click="selectQueued()" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Select queued</button>
                    <button x-show="selectedCount > 0" @click="selected = {}" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-gray-100">Clear</button>
                  </div>
                  <button
                    @click="cancel(Object.values(selected))"
                    :disabled="selectedCount === 0 || working"
                    class="px-4 py-2 text-sm font-medium text-white rounded-lg bg-error-500 hover:bg-error-600 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    Cancel<span x-show="selectedCount > 0" x-text="` (${selectedCount})`"></span>
                  </button>
                </div>

                <!-- Downloads Table -->
                <div class="overflow-x-auto">
                  <table class="downloads-table">
                    <thead class="border-b border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800">
                      <tr>
                        <th class="px-4 py-2.5 check-col"></th>
                        <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 video-col">Video</th>
                        <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 channel-col">Channel</th>
                        <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 status-col">Status</th>
                        <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200 progress-col">Progress</th>
                        <th class="px-4 py-2.5 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-200">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-800">
                      <template x-for="(download, i) in filteredDownloads" :key="download.id">
                        <tr @click="toggle(download, i, $event)" class="cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
                          <td class="px-4 py-3 check-col">
                            <input
                              type="checkbox"
                              :checked="!!selected[download.id]"
                              @click.stop="toggle(download, i, $event)"
                              class="h-5 w-5 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                            />
                          </td>
                          <td class="px-4 py-3 video-col">
                            <div class="scrollable-text">
                              <p class="text-sm font-medium text-brand-600 dark:text-brand-400" x-text="download.title || download.url"></p>
                              <a :href="safeURL(download.url)" target="_blank" rel="noopener noreferrer" @click.stop class="text-sm text-gray-500 hover:text-brand-500 dark:text-gray-400" x-text="download.url"></a>
                            </div>
                          </td>
                          <td class="px-4 py-3 channel-col">
                            <p class="text-sm text-gray-900 dark:text-white" x-text="download.channel_name"></p>
                            <p class="truncate text-xs text-gray-500 dark:text-gray-400" :title="download.channel_url" x-text="shortURL(download.channel_url)"></p>
                          </td>
                          <td class="px-4 py-3 status-col">
                            <span x-show="isDownloading(download)" class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-500">Downloading</span>
                            <span x-show="!isDownloading(download)" class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-warning-50 text-warning-600 dark:bg-warning-500/15 dark:text-warning-500">Queued</span>
                            <p x-show="download.download_status.stage" class="mt-1 text-xs text-gray-500 dark:text-gray-400" x-text="download.download_status.stage"></p>
                            <p x-show="download.download_status.error" class="mt-1 text-xs text-error-600 dark:text-error-500 break-words" x-text="download.download_status.error"></p>
                          </td>
                          <td class="px-4 py-3 progress-col">
                            <div class="flex items-center gap-2">
                              <div class="flex-1 bg-gray-200 rounded-full h-2 dark:bg-gray-700">
                                <div
                                  class="bg-brand-500 h-2 rounded-full transition-all duration-300"
                                  :style="`width: ${download.download_status.percentage}%`"
                                ></div>
                              </div>
                              <span class="text-sm text-gray-600 dark:text-gray-400 w-[3.5rem] text-right" x-text="`${download.download_status.percentage.toFixed(1)}%`"></span>
                            </div>
                          </td>
                          <td class="px-4 py-3">
                            <button
                              @click.stop="cancel([download])"
                              :disabled="working"
                              class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed dark:text-red-400 dark:hover:text-red-300 dark:hover:bg-red-900/20"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                              </svg>
                              <span>Cancel</span>
                            </button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script defer src="bundle.js"></script>
    <script>
      function downloadsData() {
        return {
          downloads: [],
          selected: {}, // Video ID -> download.
          channelFilter: '',
          urlFilter: '',
          titleFilter: '',
          loading: true,
          error: null,
          working: false,
          lastClickedIndex: null,
          pollInterval: null,

          init() {
            const params = new URLSearchParams(window.location.search);
            this.channelFilter = params.get('channel') || '';
            this.urlFilter = params.get('url') || '';
            this.titleFilter = params.get('q') || '';
            this.loadDownloads();
            this.pollInterval = setInterval(() => this.loadDownloads(), 2000);
          },

          async loadDownloads() {
            try {
              const response = await fetch('/api/v1/downloads');
              if (!response.ok) {
                throw new Error(await response.text() || 'Failed to fetch downloads');
              }
              this.downloads = await response.json() || [];
              this.error = null;
              // Drop selections which have finished.
              const live = new Set(this.downloads.map(d => d.id));
              for (const id of Object.keys(this.selected)) {
                if (!live.has(Number(id))) delete this.selected[id];
              }
            } catch (err) {
              this.error = err.message;
              clearInterval(this.pollInterval);
            } finally {
              this.loading = false;
            }
          },

          isDownloading(download) {
            return download.download_status.status === 'Downloading';
          },

          // Channels with downloads, and their counts.
          get channelOptions() {
            const byID = new Map();
            for (const d of this.downloads) {
              const ch = byID.get(d.channel_id) || { id: String(d.channel_id), name: d.channel_name, count: 0 };
              ch.count++;
              byID.set(d.channel_id, ch);
            }
            return [...byID.values()].sort((a, b) => a.name.localeCompare(b.name));
          },

          get channelDownloads() {
            if (this.channelFilter === '') return this.downloads;
            return this.downloads.filter(d => String(d.channel_id) === this.channelFilter);
          },

          // The selected channel's URLs with downloads, and their counts.
          get urlOptions() {
            const byID = new Map();
            for (const d of this.channelDownloads) {
              const u = byID.get(d.channel_url_id) || { id: String(d.channel_url_id), url: d.channel_url, count: 0 };
              u.count++;
              byID.set(d.channel_url_id, u);
            }
            return [...byID.values()];
          },

          // Downloading first, then queued, each in a stable order as the server's isn't.
          get filteredDownloads() {
            let list = this.channelDownloads;
            if (this.urlFilter !== '') {
              list = list.filter(d => String(d.channel_url_id) === this.urlFilter);
            }
            const title = this.titleFilter.trim().toLowerCase();
            if (title) { // URL too, as a download may not have a title yet.
              list = list.filter(d => (d.title || d.url || '').toLowerCase().includes(title));
            }
            return [...list].sort((a, b) => (this.isDownloading(b) - this.isDownloading(a)) || (a.id - b.id));
          },

          get selectedCount() {
            return Object.keys(this.selected).length;
          },

          filterChanged() {
            this.lastClickedIndex = null;
            const params = new URLSearchParams();
            if (this.channelFilter) params.set('channel', this.channelFilter);
            if (this.urlFilter) params.set('url', this.urlFilter);
            if (this.titleFilter.trim()) params.set('q', this.titleFilter.trim());
            const query = params.toString();
            history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
          },

          toggle(download, index, event) {
            const select = !this.selected[download.id];
            if (event.shiftKey && this.lastClickedIndex !== null) {
              const start = Math.min(this.lastClickedIndex, index);
              const end = Math.max(this.lastClickedIndex, index);
              for (const d of this.filteredDownloads.slice(start, end + 1)) {
                this.setSelected(d, select);
              }
            } else {
              this.setSelected(download, select);
            }
            this.lastClickedIndex = index;
          },

          setSelected(download, select) {
            if (select) {
              this.selected[download.id] = download;
            } else {
              delete this.selected[download.id];
            }
          },

          selectAllFiltered() {
            this.filteredDownloads.forEach(d => this.setSelected(d, true));
          },

          selectQueued() {
            this.filteredDownloads.filter(d => !this.isDownloading(d)).forEach(d => this.setSelected(d, true));
          },

          async cancel(chosen) {
            if (chosen.length === 0) return;
            const what = chosen.length === 1 ? `"${chosen[0].title || chosen[0].url}"` : `${chosen.length} downloads`;
            if (!confirm(`Cancel ${what}?\n\nPartially downloaded files will be deleted, and the videos return to the Available list.`)) return;

            this.working = true;
            try {
              const response = await fetch('/api/v1/downloads/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ video_ids: chosen.map(d => d.id) })
              });
              // 404: already finished.
              if (!response.ok && response.status !== 404) {
                throw new Error(await response.text() || response.statusText);
              }
            } catch (err) {
              alert(`Failed to cancel: ${err.message}`);
            } finally {
              this.working = false;
            }
            for (const d of chosen) delete this.selected[d.id];
            this.lastClickedIndex = null;
            await this.loadDownloads();
          },

          shortURL(url) {
            if (!url) return '';
            try {
              const u = new URL(url);
              return (u.hostname.replace(/^www\./, '') + u.pathname).replace(/\/$/, '');
            } catch {
              return url;
            }
          },

          destroy() {
            clearInterval(this.pollInterval);
          }
        };
      }
    </script>
  </body>
</html>
