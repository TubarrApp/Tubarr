<!doctype html>
<html lang="en">
  <head>
    <style>
      [x-cloak] { display: none !important; }
      .available-overlay { position: absolute; padding: 0.125rem 0.375rem; border-radius: 0.25rem; background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 0.75rem; line-height: 1rem; }
    </style>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Downloaded Videos | Tubarr</title>
    <link rel="icon" href="/src/images/favicon.ico">
    <link href="style.css" rel="stylesheet">
  </head>
  <body
    x-data="{ page: 'channelVideos', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    class="dark bg-gray-900"
  >
    <!-- ===== Preloader Start (Removed: x-init="window.addEventListener('DOMContentLoaded', () => {setTimeout(() => loaded = false, 500)})") ===== -->
    <div
      x-show="loaded"
      x-init="loaded = false"
      class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
    >
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
      ></div>
    </div>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden" x-cloak>
      <!-- include:sidebar selected="Channels" -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- include:header title="Downloaded Videos" -->

        <!-- ===== Main Content Start ===== -->
        <main class="h-full">
          <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">

            <!-- Videos Container -->
            <div
              x-data="videosData()"
              x-init="init()"
              @edit-metarr-done.window="startedMetarr.push($event.detail.id); loadActivity(); setTimeout(() => loadVideos(), 3000)"
            >
              <!-- Loading State -->
              <div x-show="loading" class="text-center py-12">
                <div class="inline-block h-12 w-12 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Loading videos...</p>
              </div>

              <!-- Error State -->
              <div x-show="error" class="rounded-2xl border border-red-200 bg-red-50 px-5 py-7 dark:border-red-800 dark:bg-red-900/20">
                <p class="text-red-600 dark:text-red-400" x-text="error"></p>
              </div>

              <!-- Delete Confirmation -->
              <div x-show="deleteDialog" x-cloak @keydown.escape.window="deleteDialog = false" class="fixed inset-0 z-99999 flex items-center justify-center bg-gray-900/50 p-4">
                <div @click.outside="deleteDialog = false" class="w-full max-w-md rounded-2xl bg-white p-6 shadow-lg dark:bg-gray-900">
                  <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
                    Delete <span x-text="selectedVideos.length"></span> video<span x-show="selectedVideos.length !== 1">s</span>?
                  </h3>
                  <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">They're removed from this channel's list, so later crawls treat them as new.</p>
                  <label class="mt-4 flex items-start gap-2 text-sm text-gray-700 dark:text-gray-300">
                    <input type="checkbox" x-model="deleteFiles" class="mt-1 h-4 w-4 rounded border-gray-300" />
                    <span>Also delete the video and metadata files from disk</span>
                  </label>
                  <div class="mt-6 flex justify-end gap-3">
                    <button type="button" @click="deleteDialog = false" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300">Cancel</button>
                    <button type="button" @click="deleteDialog = false; deleteSelected()" class="rounded-lg bg-error-500 px-4 py-2 text-sm font-medium text-white hover:bg-error-600">Delete</button>
                  </div>
                </div>
              </div>

              <!-- Videos Table -->
              <div x-show="!loading && !error" class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
                <!-- Channel Info Header -->
                <div class="flex items-center justify-between gap-4 border-b border-gray-200 px-6 py-5 dark:border-gray-800">
                  <div>
                    <h2 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="channelName"></h2>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                      Total: <span x-text="videos.length"></span> video<span x-show="videos.length !== 1">s</span>
                    </p>
                  </div>
                  <div class="flex items-center gap-3">
                  <button
                    @click="runMetarrAll()"
                    :disabled="awaitingMetarr.length === 0 || runningMetarr"
                    title="Tag, rename, transcode and move (with Metarr) all downloaded videos not yet post-processed"
                    class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    Post-Process pending (<span x-text="awaitingMetarr.length"></span>)
                  </button>
                  <button
                    x-show="metarrActive"
                    @click="stopMetarr()"
                    :disabled="stoppingMetarr"
                    title="Stop post-processing this channel's videos (running Metarr transcodes)"
                    class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <svg x-show="!stoppingMetarr" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span x-text="stoppingMetarr ? 'Stopping...' : 'Stop Post-Processing'"></span>
                  </button>
                  </div>
                </div>

                <!-- Filters -->
                <div class="flex flex-wrap items-center gap-4 border-b border-gray-200 px-6 py-5 dark:border-gray-800">
                  <input
                    type="search"
                    x-model="titleFilter"
                    @input="filterChanged()"
                    placeholder="Filter by title"
                    class="w-56 max-w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  />

                  <select
                    x-show="urlOptions.length > 1"
                    x-model="urlFilter"
                    @change="filterChanged()"
                    class="max-w-full rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All URLs (${videos.length})`"></option>
                    <template x-for="u in urlOptions" :key="u.id">
                      <option :value="u.id" :selected="urlFilter === u.id" x-text="`${shortURL(u.url)} (${u.count})`"></option>
                    </template>
                  </select>

                  <select
                    x-model="statusFilter"
                    @change="filterChanged()"
                    class="rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="" x-text="`All statuses (${urlVideos.length})`"></option>
                    <option value="finished" x-text="`Finished (${statusCount('finished')})`"></option>
                    <option value="processing" x-text="`Post-processing (${statusCount('processing')})`"></option>
                    <option value="pending" x-text="`Not post-processed (${statusCount('pending')})`"></option>
                    <option value="failed" x-text="`Post-processing failed (${statusCount('failed')})`"></option>
                  </select>

                  <select
                    x-model="sortOrder"
                    @change="currentPage = 1; lastClickedIndex = null"
                    class="rounded-lg border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  >
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="longest">Longest first</option>
                    <option value="shortest">Shortest first</option>
                  </select>
                </div>

                <!-- Bulk Actions Bar -->
                <div x-show="selectedVideos.length > 0" class="border-b border-gray-200 bg-gray-50 px-6 py-4 dark:border-gray-800 dark:bg-gray-800">
                  <div class="flex items-center justify-between">
                    <p class="text-sm font-medium text-gray-900 dark:text-white">
                      <span x-text="selectedVideos.length"></span> video<span x-show="selectedVideos.length !== 1">s</span> selected
                    </p>
                    <div class="flex gap-3">
                      <button
                        @click="clearSelection()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-gray-100"
                      >
                        Clear Selection
                      </button>
                      <button
                        @click="runMetarrSelected()"
                        :disabled="runningMetarr || selectedAwaitingMetarr.length === 0"
                        class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        Post-Process Selected
                      </button>
                      <button
                        @click="deleteFiles = false; deleteDialog = true"
                        :disabled="deleting"
                        class="px-4 py-2 text-sm font-medium text-white bg-error-500 rounded-lg hover:bg-error-600 disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <span x-show="!deleting">Delete Selected</span>
                        <span x-show="deleting">Deleting...</span>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Videos Table -->
                <div class="overflow-x-auto">
                  <table class="w-full">
                    <thead>
                      <tr class="border-b border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-800">
                        <th class="px-6 py-4 text-left">
                          <input
                            type="checkbox"
                            @change="toggleSelectAll($event.target.checked)"
                            :checked="selectedVideos.length === totalVideos && totalVideos > 0"
                            class="h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                          />
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-300">
                          Thumbnail
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-300">
                          Title
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-300">
                          Upload Date
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-300">
                          Status
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider dark:text-gray-300">
                          Actions
                        </th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-800">
                      <template x-for="video in paginatedVideos" :key="video.url">
                        <tr class="hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                          <td class="px-6 py-4">
                            <input
                              type="checkbox"
                              :value="video.url"
                              @click="handleCheckboxClick(video.url, $event)"
                              :checked="selectedVideos.includes(video.url)"
                              class="h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
                            />
                          </td>
                          <td class="px-6 py-4">
                            <div class="relative w-32 aspect-video overflow-hidden bg-gray-200 dark:bg-gray-700 rounded">
                              <div class="flex h-full w-full items-center justify-center">
                                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                </svg>
                              </div>
                              <img
                                x-show="videoThumb(video)"
                                :src="videoThumb(video)"
                                :alt="video.title"
                                loading="lazy"
                                referrerpolicy="no-referrer"
                                @error="$el.style.display = 'none'"
                                class="absolute inset-0 h-full w-full object-cover"
                              />
                              <span
                                x-show="video.duration > 0"
                                class="available-overlay"
                                style="bottom: 0.25rem; right: 0.25rem;"
                                x-text="formatDuration(video.duration)"
                              ></span>
                            </div>
                          </td>
                          <td class="px-6 py-4">
                            <div class="max-w-md">
                              <p class="text-sm font-medium text-gray-900 dark:text-white line-clamp-2" x-text="video.title"></p>
                              <p
                                x-show="video.finished && video.filesize > 0"
                                class="mt-1 text-xs text-gray-500 dark:text-gray-400"
                                x-text="formatFilesize(video.filesize)"
                              ></p>
                              <p
                                x-show="video.finished"
                                x-data="{ full: false }"
                                class="mt-1 text-xs text-gray-500 dark:text-gray-400"
                                :class="full ? 'break-words' : 'truncate'"
                                @mouseenter="$el.title = $el.scrollWidth > $el.clientWidth ? video.video_path : ''"
                                @click="if (!window.getSelection().toString() && (full || $el.scrollWidth > $el.clientWidth)) full = !full"
                                x-text="video.video_path || 'File path: N/A'"
                              ></p>
                            </div>
                          </td>
                          <td class="px-6 py-4">
                            <span class="text-sm text-gray-600 dark:text-gray-400" x-text="formatDate(video.upload_date)"></span>
                          </td>
                          <td class="px-6 py-4">
                            <template x-if="processing(video)">
                              <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-500">
                                Post-processing
                              </span>
                            </template>
                            <template x-if="video.finished && !needsMetarr(video) && !processing(video)">
                              <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/20 dark:text-green-400">
                                Finished
                              </span>
                            </template>
                            <template x-if="needsMetarr(video) && !processing(video)">
                              <span class="inline-flex flex-col items-start max-w-xs">
                                <span
                                  class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium"
                                  :class="video.metarr_status === 'failed' ? 'bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500' : 'bg-warning-50 text-warning-600 dark:bg-warning-500/15 dark:text-warning-500'"
                                  x-text="video.metarr_status === 'failed' ? 'Post-processing failed' : 'Not post-processed'"
                                ></span>
                                <span
                                  x-show="video.metarr_status === 'failed' && video.metarr_error"
                                  x-text="video.metarr_error"
                                  class="mt-1 text-xs text-error-600 dark:text-error-500 break-words whitespace-normal"
                                ></span>
                              </span>
                            </template>
                            <template x-if="!video.finished && !video.ignored && !processing(video)">
                              <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/20 dark:text-yellow-400">
                                Queued
                              </span>
                            </template>
                          </td>
                          <td class="px-6 py-4 whitespace-nowrap">
                            <button
                              x-show="metarrDone(video)"
                              @click="$dispatch('edit-metarr', { ...video, channel_id: channelId, rerun: true })"
                              :disabled="!video.json_path || !video.video_path || runningMetarr || processing(video)"
                              :title="processing(video) ? processingHint : !video.video_path ? missingFileHint : video.json_path ? 'Edit the filename, directory and ops, then post-process the finished files again with Metarr, e.g. to fix a date.' : 'Its metadata file was removed when it was post-processed, so it can\'t be processed again.'"
                              class="mr-3 text-sm font-medium text-brand-500 hover:text-brand-600 disabled:opacity-50 disabled:cursor-not-allowed dark:text-brand-400 dark:hover:text-brand-400"
                            >
                              Edit &amp; Re-Process
                            </button>
                            <button
                              x-show="!metarrDone(video)"
                              @click="runMetarr([video.id])"
                              :disabled="!needsMetarr(video) || !video.video_path || runningMetarr || processing(video)"
                              :title="processing(video) ? processingHint : needsMetarr(video) && !video.video_path ? missingFileHint : null"
                              class="mr-3 text-sm font-medium text-brand-500 hover:text-brand-600 disabled:opacity-50 disabled:cursor-not-allowed dark:text-brand-400 dark:hover:text-brand-400"
                            >
                              Post-Process
                            </button>
                            <button
                              x-show="!metarrDone(video)"
                              @click="$dispatch('edit-metarr', { ...video, channel_id: channelId })"
                              :disabled="!needsMetarr(video) || !video.video_path || runningMetarr || processing(video)"
                              :title="processing(video) ? processingHint : needsMetarr(video) && !video.video_path ? missingFileHint : 'See and edit the filename, directory and ops it\'s post-processed with (by Metarr), then post-process it.'"
                              class="mr-3 text-sm font-medium text-brand-500 hover:text-brand-600 disabled:opacity-50 disabled:cursor-not-allowed dark:text-brand-400 dark:hover:text-brand-400"
                            >
                              Edit &amp; Post-Process
                            </button>
                            <a
                              :href="safeURL(video.url)"
                              target="_blank"
                              rel="noopener noreferrer"
                              class="inline-flex items-center gap-1 text-sm text-brand-600 hover:text-brand-700 dark:text-brand-400 dark:hover:text-brand-300"
                            >
                              URL
                              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                              </svg>
                            </a>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>

                <!-- Pagination -->
                <div x-show="totalPages > 1" class="border-t border-gray-200 px-6 py-4 dark:border-gray-800">
                  <div class="flex items-center justify-between">
                    <div class="text-sm text-gray-600 dark:text-gray-400">
                      Showing <span x-text="startIndex + 1"></span> to <span x-text="Math.min(endIndex, totalVideos)"></span> of <span x-text="totalVideos"></span> videos
                    </div>
                    <div class="flex gap-2">
                      <button
                        @click="goToPage(currentPage - 1)"
                        :disabled="currentPage === 1"
                        class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700"
                      >
                        Previous
                      </button>

                      <template x-for="page in visiblePages" :key="page">
                        
                      </template>

                      <button
                        @click="goToPage(currentPage + 1)"
                        :disabled="currentPage === totalPages"
                        class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-gray-800 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700"
                      >
                        Next
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <!-- include:download-as -->

    <script defer src="bundle.js"></script>
    <script>
      function videosData() {
        return {
          channelId: null,
          channelName: '',
          videos: [],
          selectedVideos: [],
          loading: true,
          error: null,
          deleting: false,
          deleteDialog: false,
          deleteFiles: false,
          runningMetarr: false,
          metarrActive: false,
          metarrVideoIDs: [], // Videos queued for or running in Metarr, in any channel.
          startedMetarr: [], // Videos just sent to Metarr, shown as post-processing until the videos next load.
          stoppingMetarr: false,
          currentPage: 1,
          itemsPerPage: 25,
          lastClickedIndex: null,
          urlFilter: '',
          titleFilter: '',
          statusFilter: '',
          sortOrder: 'newest',
          missingFileHint: "The video file isn't at its saved path any more (moved or renamed?), so it can't be processed.",
          processingHint: 'Already post-processing. Stop it on the Post-processing page to run it again.',

          init() {
            // Get channel ID from URL params
            const urlParams = new URLSearchParams(window.location.search);
            this.channelId = urlParams.get('channel');
            this.urlFilter = urlParams.get('url') || '';
            this.titleFilter = urlParams.get('q') || '';
            this.statusFilter = urlParams.get('status') || '';

            if (!this.channelId) {
              this.error = 'No channel ID provided';
              this.loading = false;
              return;
            }

            this.loadVideos();
          },

          async loadVideos() {
            try {
              // Load channel info
              const channelResponse = await fetch(`/api/v1/channels/${this.channelId}`);
              if (!channelResponse.ok) {
                throw new Error('Failed to fetch channel information');
              }
              const channelData = await channelResponse.json();
              this.channelName = channelData.name;

              // Load videos
              const videosResponse = await fetch(`/api/v1/channels/${this.channelId}/all-videos`);
              if (!videosResponse.ok) {
                throw new Error('Failed to fetch videos');
              }

              this.videos = await videosResponse.json() || [];
              this.startedMetarr = [];
              this.loading = false;

              this.loadActivity();
              if (!this.activityTimer) {
                this.activityTimer = setInterval(() => this.loadActivity(), 3000);
              }
            } catch (err) {
              this.error = err.message;
              this.loading = false;
            }
          },

          activityTimer: null,

          async loadActivity() {
            try {
              const response = await fetch('/api/v1/channels/activity');
              if (!response.ok) return;
              const activity = await response.json();
              const wasActive = this.metarrActive;
              const wasProcessing = this.metarrVideoIDs;
              this.metarrActive = activity.metarr.includes(Number(this.channelId)); // IDs, as the page's ID comes from its URL.
              this.metarrVideoIDs = activity.metarr_videos || [];
              // Refresh statuses once Metarr finishes, or finishes one of the page's videos.
              const finished = wasProcessing.some(id => !this.metarrVideoIDs.includes(id) && this.videos.some(v => v.id === id));
              if ((wasActive && !this.metarrActive) || finished) {
                this.loadVideos();
              }
            } catch (err) {
              console.error('Error loading channel activity:', err);
            }
          },

          async stopMetarr() {
            if (!confirm(`Stop post-processing for "${this.channelName}"?\n\nRunning Metarr transcodes will be stopped. The videos can be post-processed later.`)) return;
            this.stoppingMetarr = true;
            try {
              const response = await fetch(`/api/v1/channels/${this.channelId}/stop-metarr`, { method: 'POST' });
              if (!response.ok && response.status !== 409) {
                const errorText = await response.text();
                throw new Error(errorText || 'Failed to stop post-processing');
              }
              while (this.metarrActive) {
                await new Promise(r => setTimeout(r, 1000));
                await this.loadActivity();
              }
            } catch (err) {
              alert(`Failed to stop post-processing: ${err.message}`);
            } finally {
              this.stoppingMetarr = false;
            }
          },

          needsMetarr(video) {
            return video.finished && !video.ignored && video.metarr_status !== 'done';
          },

          metarrDone(video) {
            return video.finished && !video.ignored && video.metarr_status === 'done';
          },

          processing(video) {
            return this.metarrVideoIDs.includes(video.id) || this.startedMetarr.includes(video.id);
          },

          // The video's Status column badge, as a status filter value.
          statusOf(video) {
            if (this.processing(video)) return 'processing';
            if (!this.needsMetarr(video)) return 'finished';
            return video.metarr_status === 'failed' ? 'failed' : 'pending';
          },

          // The channel's URLs with videos, and their counts.
          get urlOptions() {
            const byID = new Map();
            for (const v of this.videos) {
              const u = byID.get(v.channel_url_id) || { id: String(v.channel_url_id), url: v.channel_url, count: 0 };
              u.count++;
              byID.set(v.channel_url_id, u);
            }
            return [...byID.values()];
          },

          // The selected channel URL's videos, before the status and title filters.
          get urlVideos() {
            if (this.urlFilter === '') return this.videos;
            return this.videos.filter(v => String(v.channel_url_id) === this.urlFilter);
          },

          // How many of the selected channel URL's videos have the status.
          statusCount(status) {
            return this.urlVideos.filter(v => this.statusOf(v) === status).length;
          },

          get filteredVideos() {
            let list = this.urlVideos;
            if (this.statusFilter !== '') {
              list = list.filter(v => this.statusOf(v) === this.statusFilter);
            }
            const title = this.titleFilter.trim().toLowerCase();
            if (title) {
              list = list.filter(v => (v.title || '').toLowerCase().includes(title));
            }
            // The server sends most recently updated first. Videos without a known duration go last when sorting by it,
            // and equal durations stay in that order.
            switch (this.sortOrder) {
              case 'oldest':
                return [...list].reverse();
              case 'longest':
                return [...list].sort((a, b) => (b.duration || -1) - (a.duration || -1));
              case 'shortest':
                return [...list].sort((a, b) => (a.duration || Infinity) - (b.duration || Infinity));
              default:
                return list;
            }
          },

          // Applies a filter change: back to page 1 with nothing selected, so actions only touch videos on show.
          filterChanged() {
            this.currentPage = 1;
            this.lastClickedIndex = null;
            this.selectedVideos = [];
            const params = new URLSearchParams({ channel: this.channelId });
            if (this.urlFilter) params.set('url', this.urlFilter);
            if (this.titleFilter.trim()) params.set('q', this.titleFilter.trim());
            if (this.statusFilter) params.set('status', this.statusFilter);
            history.replaceState(null, '', `?${params}`);
          },

          shortURL(url) {
            if (!url) return '';
            try {
              const u = new URL(url);
              return (u.hostname.replace(/^www\./, '') + u.pathname).replace(/\/$/, '');
            } catch {
              return url;
            }
          },

          get awaitingMetarr() {
            return this.videos.filter(v => this.needsMetarr(v) && !this.processing(v));
          },

          get selectedAwaitingMetarr() {
            return this.awaitingMetarr.filter(v => this.selectedVideos.includes(v.url));
          },

          async runMetarrAll() {
            const n = this.awaitingMetarr.length;
            if (!confirm(`Post-process ${n} video(s)? This may start transcodes.`)) return;
            await this.runMetarr([]);
          },

          async runMetarrSelected() {
            await this.runMetarr(this.selectedAwaitingMetarr.map(v => v.id));
          },

          async runMetarr(videoIds) {
            this.runningMetarr = true;
            try {
              const response = await fetch(`/api/v1/channels/${this.channelId}/run-metarr`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ video_ids: videoIds })
              });
              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Failed to start post-processing');
              }
              this.startedMetarr = videoIds.length > 0 ? videoIds : this.awaitingMetarr.map(v => v.id);
              await this.loadActivity();
              setTimeout(() => this.loadVideos(), 3000);
            } catch (err) {
              alert(`Error post-processing: ${err.message}`);
              console.error('Post-process error:', err);
            } finally {
              this.runningMetarr = false;
            }
          },

          get totalVideos() {
            return this.filteredVideos.length;
          },

          get totalPages() {
            return Math.ceil(this.totalVideos / this.itemsPerPage);
          },

          get startIndex() {
            return (this.currentPage - 1) * this.itemsPerPage;
          },

          get endIndex() {
            return this.startIndex + this.itemsPerPage;
          },

          get paginatedVideos() {
            return this.filteredVideos.slice(this.startIndex, this.endIndex);
          },

          get visiblePages() {
            const pages = [];
            const maxVisible = 5;
            let startPage = Math.max(1, this.currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(this.totalPages, startPage + maxVisible - 1);

            if (endPage - startPage < maxVisible - 1) {
              startPage = Math.max(1, endPage - maxVisible + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
              pages.push(i);
            }

            return pages;
          },

          goToPage(page) {
            if (page >= 1 && page <= this.totalPages) {
              this.currentPage = page;
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          },

          // A click toggles one video; shift-click selects just the videos back to the last click, ctrl/cmd+shift adds them.
          handleCheckboxClick(videoUrl, event) {
            const currentIndex = this.filteredVideos.findIndex(v => v.url === videoUrl);
            if (currentIndex === -1) return;

            const shouldSelect = event.target.checked;

            if (event.shiftKey && this.lastClickedIndex !== null) {
              const start = Math.min(this.lastClickedIndex, currentIndex);
              const end = Math.max(this.lastClickedIndex, currentIndex);
              const selectedSet = new Set(event.ctrlKey || event.metaKey ? this.selectedVideos : []);
              for (const v of this.filteredVideos.slice(start, end + 1)) {
                selectedSet.add(v.url);
              }
              this.selectedVideos = Array.from(selectedSet);
            } else {
              const selectedSet = new Set(this.selectedVideos);
              if (shouldSelect) {
                selectedSet.add(videoUrl);
              } else {
                selectedSet.delete(videoUrl);
              }
              this.selectedVideos = Array.from(selectedSet);
              this.lastClickedIndex = currentIndex;
            }
          },

          toggleSelectAll(checked) {
            if (checked) {
              // Select all filtered videos across all pages
              this.selectedVideos = this.filteredVideos.map(v => v.url);
            } else {
              // Deselect all videos
              this.selectedVideos = [];
            }
          },

          clearSelection() {
            this.selectedVideos = [];
          },

          // Deletes the selected videos, as confirmed in the delete dialog.
          async deleteSelected() {
            if (this.selectedVideos.length === 0) return;

            this.deleting = true;
            try {
              // Channel ID is passed in the URL path: /api/v1/channels/{id}/delete-videos
              const formData = new URLSearchParams();
              this.selectedVideos.forEach(url => {
                formData.append('urls[]', url);
              });
              if (this.deleteFiles) {
                formData.append('delete_files', 'true');
              }

              const response = await fetch(`/api/v1/channels/${this.channelId}/delete-videos`, {
                method: 'DELETE',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData.toString()
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || 'Failed to delete videos');
              }

              // Remove deleted videos from local array
              this.videos = this.videos.filter(v => !this.selectedVideos.includes(v.url));
              this.selectedVideos = [];

              // Adjust current page if needed
              if (this.paginatedVideos.length === 0 && this.currentPage > 1) {
                this.currentPage--;
              }
            } catch (err) {
              alert(`Error deleting videos: ${err.message}`);
              console.error('Delete error:', err);
            } finally {
              this.deleting = false;
            }
          },

          formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = String(seconds % 60).padStart(2, '0');
            return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
          },

          formatFilesize(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
              bytes /= 1024;
              i++;
            }
            return i === 0 ? `${bytes} B` : `${bytes.toFixed(1)} ${units[i]}`;
          },

          formatDate(dateString) {
            if (!dateString || dateString === '0001-01-01T00:00:00Z') return 'Unknown';

            // Parse the date ensuring proper timezone handling
            // If the date doesn't have a timezone indicator, treat it as UTC
            let dateStr = dateString;
            if (!dateStr.endsWith('Z') && !dateStr.includes('+') && !dateStr.includes('T')) {
              // Date-only format, already treated as UTC by spec
              dateStr = dateString;
            } else if (dateStr.includes('T') && !dateStr.endsWith('Z') && !dateStr.includes('+') && !dateStr.includes('-', 10)) {
              // Has time but no timezone, assume UTC
              dateStr = dateString + 'Z';
            }

            // An upload date is a calendar day, so its YYYY-MM-DD part is read as a local date.
            const ymd = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateString);
            const date = ymd ? new Date(+ymd[1], ymd[2] - 1, +ymd[3]) : new Date(dateStr);

            // Validate the date
            if (isNaN(date.getTime())) {
              return 'Unknown';
            }

            // Compare dates at day-level precision (metadata typically only has date, not time)
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const uploadDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffMs = today - uploadDate;
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffDays === 0) {
              return 'Today';
            } else if (diffDays === 1) {
              return 'Yesterday';
            } else if (diffDays < 7) {
              return `${diffDays} days ago`;
            } else {
              return date.toLocaleDateString();
            }
          }
        };
      }
    </script>
  </body>
